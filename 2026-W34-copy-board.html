<script>const week=[{"day": "周一", "column": "邮轮玩法", "topic": "莱茵河河轮", "short": "今天给大家介绍莱茵河河轮。船沿着莱茵河慢慢走，白天看两岸古堡、葡萄园和小镇，傍晚上岸散散步、吃顿当地饭，不用天天换酒店搬行李，特别适合不想折腾的长辈。", "group": "【今日主题】\n莱茵河河轮，沿江看古堡小城\n\n【适合谁】\n1. 想看欧洲、但不想天天换酒店、拖行李赶车的长辈。\n2. 喜欢慢节奏：船是\"移动酒店\"，晚上停下一座城，白天接着走。\n3. 想一次看德国小镇、法国葡萄酒乡、荷兰风车，又不想自己做复杂交通。\n\n【这条玩法是什么】\n莱茵河河轮是内河游轮，不是大海邮轮。船不大，沿河航行，常见 7–14 晚，停靠科布伦茨、吕德斯海姆、斯特拉斯堡、巴塞尔等河岸城镇。\n关键：上岸就是中世纪老城、城堡和葡萄园，步行就能逛，不用长途大巴转运。\n\n【主要亮点】\n白天在甲板上看古堡从窗边掠过、葡萄园一层层铺到河边；傍晚上岸，走进石板老街吃顿饭、喝杯本地白葡萄酒。一座城睡一晚，第二天睁眼又是新风景。\n\n【特色体验】\n清晨在房间看河面起雾，船缓缓驶过两座山崖间的古堡。下午靠岸，沿着河堤走走，看老城钟楼、彩色木筋屋，路旁小馆子来份烤猪肘或一杯雷司令。这种\"白天看景、晚上散步\"的节奏，是陆路自由行很难给的。\n\n【建议怎么玩】\n莱茵河一地 7–10 天轻松；想看更多可加多瑙河联游（约 14–20 天）。选产品看三点：停靠哪些镇、舱房有没有阳台、含不含岸上观光和机票。\n\n【预算参考】\n含国际机票的跟团河轮（标准 / 露台舱，10–12 天）：携程参考约 28000 元/人起（常见 28000–46000 元/人，阳台舱与暑期旺季更高）。\n具体价格看出发城市、舱房、航期和团期。\n\n【需要注意】\n河轮多为欧洲内河航线，需办理申根签证；部分航段步行上下岸，长辈出行前确认体力与步态。\n船上医疗有限，有慢性病建议出发前评估、备好常用药。\n\n【一句话总结】\n莱茵河河轮值得选的，是那种\"不用自己安排交通，古堡葡萄园却一座座从窗边过\"的轻松。", "moments": "前几天帮客户排欧洲线路，越看越觉得莱茵河河轮适合不想折腾的长辈。船沿着河慢慢走，白天看两岸古堡和葡萄园，傍晚上岸在老城散散步、吃顿饭，第二天睁眼又是另一座城。不用查火车、不用拖箱子换酒店，真省心。想了解哪趟合适，私信我帮你看 🚢\n\n---"}, {"day": "周二", "column": "目的地推荐", "topic": "加拿大落基山", "short": "今天给大家推荐加拿大落基山。八月正好是黄金季，气温二十度上下，不燥不热，松绿湖、雪山和冰川公路一路看过来，特别适合怕热、想找个凉快地方慢游的朋友。", "group": "【今日目的地】\n加拿大落基山，八月刚好凉快\n\n【适合谁】\n1. 怕热、想夏天找个凉快地方，又想看山看湖的人。\n2. 喜欢开车沿景观公路走、湖边散步、坐缆车看雪山的节奏。\n3. 想一次看班夫、露易丝湖、哥伦比亚冰原，不追高强度徒步。\n\n【为什么值得去】\n很多人以为加拿大只有冬天冷，其实八月是落基山最好的季节：气温多在二十度上下，雪山、松绿湖和冰川都看得清清楚楚，不闷不燥。\n而且这里的\"绿\"很特别——露易丝湖那种松绿松绿的颜色，是冰川融水带着岩粉留下的，全世界少见。\n\n【主要看什么】\n班夫小镇与弓河：老牌山城，餐馆商店齐全。\n露易丝湖：松绿湖面映着雪山，湖边走走就够。\n哥伦比亚冰原：坐冰原雪车上去，脚下就是万年冰川。\n贾斯珀：更安静的另一座山城，湖和峡谷都原始。\n\n【特色体验】\n早上在露易丝湖边看雪山倒影，湖水是那种不真实的松绿；中午开车走冰原大道，窗外一会儿是瀑布、一会儿是冰川；傍晚到班夫泡个温泉，抬头就是山。夏天不热，走多久都不黏。\n\n【建议玩几天】\n落基山一地 7–9 天舒服；加温哥华或多伦多东西岸连线 12–14 天。景区之间靠景观公路，建议含接送或当地参团，少自己开长途。\n\n【预算参考】\n跟团游（含机票）：携程参考约 21000 元/人起（常见 21000–30000 元/人，7–9 天一地；加东西岸长线 28000–40000 元/人，淡旺季浮动）。\n具体价格看出发城市、航班、酒店和天数。\n\n【不适合谁】\n期待\"热带海岛、天天晒太阳\"的人——落基山是山地凉区，晴天也多为二十度出头。\n\n【一句话总结】\n加拿大落基山八月值得去的，是那种\"二十度上下不燥热，松绿湖和冰川都能慢慢看\"的清爽。", "moments": "夏天太热的时候，我反而想推加拿大落基山。八月正好是黄金季，气温才二十度上下，不燥。露易丝湖那种松绿松绿的颜色，是冰川融水带岩粉留下的，全世界少见；开车走冰原大道，窗外一会儿瀑布一会儿冰川。想了解怎么走省心，私信我聊聊 🏔️\n\n---"}, {"day": "周三", "column": "安心出行小贴士", "topic": "夏天出门防中暑防晒", "short": "今天给大家提个醒：夏天出门玩，别只在乎景点，先防中暑和晒。避开正午最晒的时段、多喝点水、宽檐帽墨镜防晒霜备上，长辈尤其要注意，头晕恶心早点到阴凉处休息。", "group": "【今日提醒】\n夏天出门，先防中暑和晒\n\n【为什么重要】\n夏天很多地方气温高、太阳毒，60/70 后长辈体温调节弱，在户外走久了容易中暑：头晕、恶心、心慌，严重的还会出问题。防晒不只是怕黑，更是怕晒伤和中暑叠加。\n\n【具体怎么做】\n1. 尽量把户外安排放在早晚，正午最晒的 11–15 点进室内或阴凉处。\n2. 宽檐帽、墨镜、防晒霜（SPF30+，出汗补涂）都带上；穿浅色透气长袖更护皮肤。\n3. 少量多次喝温水或电解质水，别等渴了才喝；少喝冰的、烈酒咖啡。\n4. 随身带把折叠伞，既能遮阳也能挡阵雨。\n\n【容易忽略的细节】\n很多人一出门就猛晒一中午，或为了赶景点硬撑——恰恰最容易中暑。\n觉得头晕、心慌、出冷汗，立刻到阴凉处坐下、喝水、松开衣领，别硬扛。\n\n【适合提前准备】\n出发前在包里放一瓶水、一顶帽、一支防晒、一包电解质粉；有高血压或心脏问题的，常用药随身带、别托运。\n\n【一句话总结】\n夏天出门护自己不难：躲正午、多喝水、帽子和防晒备上，不舒服早歇。", "moments": "这两天看天气预报，好多地方都奔三十五六度了。出门玩的长辈一定记着：正午最晒那几个小时别硬逛，宽檐帽墨镜防晒霜带上，水少量多次喝。真觉得头晕心慌出冷汗，赶紧到阴凉处坐下歇，别撑。这比什么攻略都实在，常出门的朋友存一下 ☀️\n\n---"}, {"day": "周四", "column": "目的地推荐", "topic": "秘鲁马丘比丘", "short": "今天给大家推荐秘鲁马丘比丘。八月正好是当地旱季，晴天多、不闷，是一年里最适合上去的时候。这座建在云端的印加古城，石头不用灰浆却屹立五百年，很适合想看世界文明的朋友。", "group": "【今日目的地】\n马丘比丘，云端的印加古城\n\n【适合谁】\n1. 想看世界级文明遗迹、愿意为\"此生一次\"的风景安排一趟长途的人。\n2. 喜欢山景、古城、慢节奏深度游，不追打卡数量。\n3. 能接受长途飞行和海拔适应（库斯科约 3400 米），出行前愿做身体评估。\n\n【为什么值得去】\n很多人以为马丘比丘只是\"失落古城\"，其实它是印加人用巨石、不用一点灰浆拼出的城：石缝严丝合缝，朝向对应日月和山形，是天文、工程与信仰合在一起的作品。\n而且八月正好是旱季，晴天多、不闷，是一年里最适合上去看清楚的时候。\n\n【主要看什么】\n库斯科：印加古城与殖民老城叠在一起，Plaza de Armas 很出片。\n圣谷：梯田、盐田和集市，节奏慢。\n马丘比丘：建在群峰之间的古城遗址，坐观光火车上去。\n体力好可加彩虹山或的的喀喀湖。\n\n【特色体验】\n清晨坐观光火车进谷，雾散时马丘比丘从云里露出来，巨石平台对着远山。走在没用灰浆却五百年不倒的石墙间，会明白为什么它被称为\"云端的城\"。傍晚回库斯科老城，石板路配暖黄灯，像走进另一段时间。\n\n【建议玩几天】\n秘鲁一地 9–12 天比较舒服（含利马、库斯科、圣谷、马丘比丘）；想看更多可走南美多国连线 14–17 天。库斯科海拔不低，建议留 1–2 天适应再上遗址。\n\n【预算参考】\n跟团游（含机票）：携程参考约 32000 元/人起（常见 32000–48000 元/人，9–12 天一地；南美多国连线 42000–70000 元/人，淡旺季浮动）。\n具体价格看出发日期、航班、酒店和天数。\n\n【不适合谁】\n近期不宜高原、或完全不愿长途飞行和海拔适应的人——这条线对体力与行程强度有一定要求。\n\n【一句话总结】\n马丘比丘值得去的，是那种\"石头不用灰浆却屹立五百年，建在云端的文明\"的震撼。", "moments": "最近排南美线路，越看越觉得马丘比丘值得一辈子去一次。八月正好是旱季，晴天多、不闷，最合适上去。最打动我的是那石头城——不用一点灰浆，严丝合缝立了五百年，朝向还对着日月和山。想了解怎么安排身体能扛住，私信我聊聊 🏛️\n\n---"}, {"day": "周五", "column": "全球景点与体验", "topic": "日本夏日花火大会", "short": "今天给大家介绍日本夏日的花火大会。日本人把夏天仪式感做到顶：穿浴衣、摊前吃刨冰，抬头看烟花在河面倒影里炸开。对咱们来说，是看一种把\"短暂\"过成盛大的生活态度，很适合夏天去感受。", "group": "【今日体验】\n日本花火大会，夏夜看漫天火\n\n【为什么特别】\n很多人以为花火大会就是\"放烟花凑热闹\"，其实对日本人它是夏天仪式感的顶点：一家人穿浴衣、摊前吃刨冰章鱼烧，抬头看烟花在河面倒影里一层层炸开。\n对咱们来说，更值得看的是这种把\"短暂\"过成盛大的生活态度——一年就这一晚，却认真到极致。\n\n【特色体验】\n傍晚到河边，摊子飘着烤鱿鱼和苹果糖的香味，小孩举着仙女棒跑。天一黑，第一发冲上天，河面倒影跟着亮成一片。大曲、长冈这类顶级大会，烟花能连成几分钟的\"壁画\"，看完人会安静一会儿。\n\n【适合谁】\n1. 想夏天去日本、体验本地节庆氛围，而不只是逛景点的朋友。\n2. 喜欢慢节奏、愿意为一晚上的仪式感专程安排的人。\n3. 亲子或长辈同行，想看一场不累、坐着就能看的夏夜。\n\n【最佳时间】\n七月到八月是日本花火大会最集中的季节；八月各地大会密集，天气也最稳定。具体日期每年不同，出发前确认当年场次。\n\n【怎么到达或怎么安排】\n如果您是自由行，从东京等大城市出发可以参加花火大会一日游，含往返接送和观赏席门票，不用自己抢票、不用深夜挤电车。这个体验适合放进日本整线，或作为东京周边的一日游安排。\n\n【预算参考】\n东京出发花火大会一日游（含接送 + 观赏席门票）：携程参考约 380 元/人起（常见 700–2200 元/人，三大花火等热门大会更高）。\n高端桟敷席小团：约 2300 元/人起（常见 2300–4500 元/人）。\n\n【需要注意】\n花火大会遇大雨大风常临时取消，一日游多有改期或退款规则，出发前留意通知。\n热门大会席位紧张，建议提前订；现场人多，长辈同行注意看管好随身物。\n\n【适合搭配哪条线路】\n适合放进\"日本本州\"跟团或定制游；若只在东京周边，单独一日游就能看个够。\n\n【一句话总结】\n日本花火大会值得看的，是那种\"用一晚的认真，把夏天过成盛大\"的仪式感。", "moments": "前阵子排日本线路，越看越觉得夏天的花火大会值得专程去一次。日本人把夏天仪式感做到顶：穿浴衣、摊前吃刨冰，抬头看烟花在河面倒影里炸开。对咱们来说，是看一种把\"短暂\"过成盛大的生活态度。想轻松看一场，私信我聊聊 🎆"}];

};const nav=document.getElementById("dayNav"),cards=document.getElementById("cards"),title=document.getElementById("pageTitle"),subtitle=document.getElementById("pageSubtitle"),imageNote=document.getElementById("imageNote"),toast=document.getElementById("toast"),copyAll=document.getElementById("copyAll");let current=0;function copyText(value,button){navigator.clipboard.writeText(value).then(()=>{const old=button.textContent;button.textContent="已复制";button.classList.add("copied");toast.classList.add("show");setTimeout(()=>{button.textContent=old;button.classList.remove("copied");toast.classList.remove("show")},1300)})}function card(label,value,brief=false){const article=document.createElement("article");article.className=brief?"card brief":"card";const header=document.createElement("header"),heading=document.createElement("h3"),button=document.createElement("button"),area=document.createElement("textarea");heading.textContent=label;button.className="copy-btn";button.textContent="复制文案";button.addEventListener("click",()=>copyText(value,button));area.value=value;area.setAttribute("aria-label",label);header.append(heading,button);article.append(header,area);return article}function render(index){current=index;const item=week[index];[...nav.children].forEach((button,i)=>button.classList.toggle("active",i===index));title.textContent=`${item.day}｜${item.column}`;subtitle.textContent=item.topic;imageNote.textContent=notes[item.day];cards.replaceChildren(card("简短群发版",item.short,true),card("群发版",item.group),card("朋友圈版",item.moments))}week.forEach((item,index)=>{const button=document.createElement("button");button.innerHTML=`<span class="day">${item.day} · ${item.column}</span><span class="topic">${item.topic}</span>`;button.addEventListener("click",()=>render(index));nav.append(button)});copyAll.addEventListener("click",()=>{const item=week[current];copyText(`【简短群发版】
${item.short}

【群发版】
${item.group}

【朋友圈版】
${item.moments}`,copyAll)});render(0);</script></body></html>
