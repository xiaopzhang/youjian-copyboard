<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>又见世界｜第一周文案复制板</title>
    <style>
      :root {
        --bg: #f6f8f7;
        --panel: #ffffff;
        --text: #1f2c29;
        --muted: #65736f;
        --line: #d8e5e0;
        --accent: #0f5c55;
        --accent-dark: #0a403b;
        --accent-soft: #eaf5f2;
        --warn-soft: #fff8e8;
        --shadow: 0 16px 40px rgba(17, 42, 38, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        line-height: 1.6;
      }

      button,
      textarea {
        font: inherit;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 24px 18px;
        border-right: 1px solid var(--line);
        background: #ffffff;
        overflow: auto;
      }

      .brand {
        margin-bottom: 22px;
      }

      .brand h1 {
        margin: 0 0 6px;
        color: var(--accent-dark);
        font-size: 20px;
        line-height: 1.25;
      }

      .brand-home {
        display: inline-block;
        color: inherit;
        text-decoration: none;
        border-radius: 4px;
      }

      .brand-home:hover h1 {
        color: var(--accent);
      }

      .brand-home:focus-visible {
        outline: 3px solid #acd2c9;
        outline-offset: 4px;
      }

      .brand p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .nav {
        display: grid;
        gap: 8px;
      }

      .nav button {
        width: 100%;
        padding: 12px 12px;
        border: 1px solid transparent;
        border-radius: 8px;
        color: var(--text);
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .nav button:hover {
        background: var(--accent-soft);
      }

      .nav button.active {
        border-color: #acd2c9;
        background: var(--accent-soft);
        color: var(--accent-dark);
      }

      .nav .day {
        display: block;
        font-size: 14px;
        font-weight: 700;
      }

      .nav .topic {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
      }

      .content {
        padding: 32px;
      }

      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .title h2 {
        margin: 0 0 6px;
        color: var(--accent-dark);
        font-size: 28px;
        line-height: 1.25;
      }

      .title p {
        margin: 0;
        color: var(--muted);
      }

      .tools {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .copy-all,
      .ghost {
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        color: var(--accent-dark);
        cursor: pointer;
        white-space: nowrap;
      }

      .copy-all {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      .copy-all:hover {
        background: var(--accent-dark);
      }

      .ghost:hover {
        background: var(--accent-soft);
      }

      .notice {
        margin-bottom: 22px;
        padding: 14px 16px;
        border: 1px solid #e8d9a9;
        border-radius: 8px;
        background: var(--warn-soft);
        color: #5f4b16;
        font-size: 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .card {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .card header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        background: #fbfdfc;
      }

      .card h3 {
        margin: 0;
        color: var(--accent-dark);
        font-size: 18px;
      }

      .copy-btn {
        min-width: 86px;
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
      }

      .copy-btn:hover {
        background: var(--accent-dark);
      }

      .copy-btn.copied {
        border-color: #2f8f68;
        background: #2f8f68;
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 640px;
        padding: 16px;
        border: 0;
        color: var(--text);
        background: #ffffff;
        resize: vertical;
        outline: none;
        white-space: pre-wrap;
        font-size: 16px;
        line-height: 1.75;
      }

      .image-note {
        margin-top: 18px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
      }

      .image-note h3 {
        margin: 0 0 6px;
        color: var(--accent-dark);
        font-size: 16px;
      }

      .image-note p {
        margin: 0;
        color: var(--muted);
      }

      .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #173f3a;
        color: #ffffff;
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.18s ease, transform 0.18s ease;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 920px) {
        .app {
          display: block;
        }

        .sidebar {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .content {
          padding: 22px 16px;
        }

        .topbar {
          display: block;
        }

        .tools {
          margin-top: 14px;
          justify-content: flex-start;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        textarea {
          min-height: 520px;
        }
      }

      @media (max-width: 560px) {
        .nav {
          grid-template-columns: 1fr;
        }

        .title h2 {
          font-size: 23px;
        }
      }
    </style>
  </head>

      const nav = document.querySelector("#dayNav");
      const pageTitle = document.querySelector("#pageTitle");
      const pageSubtitle = document.querySelector("#pageSubtitle");
      const cards = document.querySelector("#cards");
      const imageNote = document.querySelector("#imageNote");
      const copyBoth = document.querySelector("#copyBoth");
      const toast = document.querySelector("#toast");

      let activeIndex = 0;

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1600);
      }

      async function copyText(text, label, button) {
        try {
          await navigator.clipboard.writeText(text);
        } catch (error) {
          const helper = document.createElement("textarea");
          helper.value = text;
          helper.style.position = "fixed";
          helper.style.left = "-9999px";
          document.body.appendChild(helper);
          helper.select();
          document.execCommand("copy");
          helper.remove();
        }

        if (button) {
          const oldText = button.textContent;
          button.textContent = "已复制";
          button.classList.add("copied");
          window.setTimeout(() => {
            button.textContent = oldText;
            button.classList.remove("copied");
          }, 1400);
        }
        showToast(`已复制${label}`);
      }

      function renderNav() {
        nav.innerHTML = "";
        week.forEach((item, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = index === activeIndex ? "active" : "";
          button.innerHTML = `<span class="day">${item.day}｜${item.column}</span><span class="topic">${item.topic}</span>`;
          button.addEventListener("click", () => {
            activeIndex = index;
            render();
          });
          nav.appendChild(button);
        });
      }

      function createCard(title, text) {
        const card = document.createElement("article");
        card.className = "card";

        const header = document.createElement("header");
        const heading = document.createElement("h3");
        heading.textContent = title;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "copy-btn";
        button.textContent = "复制";
        button.addEventListener("click", () => copyText(text, title, button));
        header.append(heading, button);

        const area = document.createElement("textarea");
        area.value = text;
        area.spellcheck = false;
        area.addEventListener("focus", () => area.select());

        card.append(header, area);
        return card;
      }

      function render() {
        const item = week[activeIndex];
        renderNav();
        pageTitle.textContent = `${item.day}｜${item.column}`;
        pageSubtitle.textContent = `今日选题：${item.topic}`;
        imageNote.textContent = item.image;
        cards.innerHTML = "";
        cards.append(createCard("群发版", item.group), createCard("朋友圈版", item.moments));
      }

      copyBoth.addEventListener("click", () => {
        const item = week[activeIndex];
        const text = `【群发版】\n\n${item.group}\n\n------------------------------\n\n【朋友圈版】\n\n${item.moments}`;
        copyText(text, "当天两版", copyBoth);
      });

      render();
    </script>
