<script>const week=[{"day": "周一", "column": "邮轮玩法", "topic": "日本邮轮", "short": "今天给大家介绍日本邮轮。从中国母港出发去日本，岸上游不用自己办签证，船方统一代办登陆许可；白天逛福冈、长崎这些港口城市，晚上回船上吃饭看海，不用天天换酒店搬行李。", "group": "【今日主题】\n日本邮轮，免签上岸不办签证\n\n【适合谁】\n1. 想出国看看、但不想为签证、换汇、做攻略折腾的长辈。\n2. 喜欢慢节奏：白天上岸逛，晚上回船吃住，不用天天换酒店搬行李。\n3. 饮食和语言更省心：船上中餐多、岸上中文团，沟通负担小。\n\n【这条玩法是什么】\n从中国母港（上海、天津等）出发的日本航线，常见 4–7 晚，停靠福冈、长崎、鹿儿岛、冲绳等港口。\n关键一点：中国母港出发的日本航线，岸上游不用自己办日本个人旅游签证——船方会统一代办\"岸上观光登陆许可证\"，护照随船、离港前回船即可。\n\n【主要亮点】\n船上就是移动度假村：餐厅、演出、泳池甲板一应俱全；白天靠岸，下去逛日本港口城市，晚上回船睡觉，第二天又是新港口。\n不用自己查火车、订酒店、拖行李，节奏对长辈很友好。\n\n【特色体验】\n清晨在房间阳台看海，船慢慢驶入港口。下船后慢慢逛福冈的屋台小巷、长崎的教堂与山坡老街，傍晚回船冲个澡、看场演出。这种\"白天逛日本、晚上回海上\"的节奏，是陆路自由行很难给的。\n\n【建议怎么玩】\n中日航线本身 4–7 晚，加上前后往返，安排 5–9 天都轻松。\n选产品看三点：停靠哪些港、岸上观光含什么、舱房与餐食标准，别只比价格。\n\n【预算参考】\n含国际机票的跟团邮轮（中国母港出发）：携程参考约 5500 元/人起（常见 5500–20000 元/人，按舱房与淡旺季浮动）。\n具体价格看出发城市、舱房、航期和团期。\n\n【需要注意】\n护照需在航程结束后仍有 6 个月以上有效期，并带好护照复印件。\n2026 年 7 月起日本对离境旅客征收国际观光旅客税（约 3000 日元/人），通常船上结算，出发前确认。\n船上医疗设施有限，长辈出行前建议做一次健康评估、备好常用药，最好有家人同行。\n\n【一句话总结】\n日本邮轮值得选的，是那种\"不用自己办签证、不用天天搬行李，也能慢慢看几座日本港口\"的轻松。", "moments": "前几天帮客户排暑期线路，发现日本邮轮特别适合不想折腾的长辈。中国母港出发，岸上去日本不用自己跑签证，船方统一办登陆许可；白天靠岸逛逛福冈、长崎，晚上回船上吃个饭看场演出，第二天睁眼又是另一座港。不用查火车、不用拖箱子换酒店，真省心。想了解哪趟合适，私信我帮你看 🚢"}, {"day": "周二", "column": "目的地推荐", "topic": "巴厘岛", "short": "今天给大家推荐巴厘岛。八月正好是当地旱季，雨水少、天天好太阳，海边酒店醒来就是海，梯田神庙慢慢逛，下午做个 spa、傍晚看日落，特别适合想慢下来的朋友。", "group": "【今日目的地】\n巴厘岛，八月旱季慢游海岛\n\n【适合谁】\n1. 想找个暖和海岛过几天慢生活，又怕雨季泡汤的人。\n2. 喜欢\"上午看景、下午发呆\"的节奏，不追打卡数量。\n3. 第一次出境海岛游、希望语言饮食都省心的家庭或朋友结伴。\n\n【为什么值得去】\n很多人以为巴厘岛只是\"蜜月岛\"，其实它最舒服的是八月——正好是当地旱季，雨水少、湿度低，天天大太阳但不闷。\n而且巴厘岛把\"度假\"做得特别松弛：海边酒店醒来就是海，梯田和神庙在半山，乌布雨林里做做 spa，节奏完全可以自己定。\n\n【主要看什么】\n海神庙：潮水退去时孤悬海上，是巴厘岛最经典的画面。\n德格拉朗梯田：层层绿浪一直铺到山脚，阴凉好走。\n乌布：雨林、猴林、手作小店和餐厅，慢逛一下午。\n金巴兰 / 努沙杜瓦：海边看日落、吃海鲜。\n\n【特色体验】\n早上在海边酒店吃早餐，看浪一层层拍上来。上午去梯田或神庙，午后在乌布雨林里做个 spa，傍晚到海边看夕阳把云染成橘色。不用赶，坐下来发会儿呆，就是旅行。\n\n【建议玩几天】\n巴厘岛一地或搭配新加坡 / 泰国，安排 6–8 天比较舒服。岛内路况一般，建议含接送或当地参团，少自己开车。\n\n【预算参考】\n跟团游（含机票）：携程参考约 4000 元/人起（常见 4500–7000 元/人）。\n定制小团 / 私家团：约 7000 元/人起（常见 7000–13000 元/人）。\n具体价格看出发城市、航班、酒店和天数。\n\n【不适合谁】\n期待\"低价扫货、天天逛商场\"的人——巴厘岛主打自然与度假，购物不是重点。\n\n【一句话总结】\n巴厘岛八月值得去的，是那种\"旱季里天天好天气，看海、看田、发呆都刚好\"的松弛。", "moments": "最近好多朋友问暑假去哪凉快又舒服，我倒觉得反过来——去巴厘岛晒太阳。八月正好是当地旱季，几乎不下雨，海边酒店醒来就是海，上午去看梯田神庙，下午在乌布雨林做个 spa，傍晚坐海边看夕阳。不用赶景点，节奏自己定。想了解怎么安排省心，私信我聊聊 🌴"}, {"day": "周三", "column": "安心出行小贴士", "topic": "长途飞行防腿肿", "short": "今天给大家提个醒：坐长途飞机别一直不动。每隔一小时起身走几步，或在座位上勾勾脚踝、多喝点水，能明显减轻腿肿，也护血管。长辈和平时腿容易肿的朋友尤其要注意。", "group": "【今日提醒】\n长途飞行，久坐腿肿这样防\n\n【为什么重要】\n坐长途飞机（尤其 5–10 小时以上），腿长时间不动，血液回流慢，容易肿，甚至增加下肢静脉血栓的风险。60/70 后长辈、平时腿容易肿的朋友更要注意。\n\n【具体怎么做】\n1. 登机后每隔 1 小时左右起身走几步，或在座位上做\"脚尖勾放、脚踝画圈\"。\n2. 穿宽松衣裤，长途可备一双医用弹力袜（出发前咨询医生是否适合）。\n3. 多喝水、少喝酒和咖啡，避免脱水让血液更稠。\n4. 选过道座更容易起身活动；有慢性病或近期手术的，出发前先问医生。\n\n【容易忽略的细节】\n很多人一上飞机就睡一路不动，或者怕麻烦不喝水——恰恰最容易肿。\n随身带个小水杯，设个提醒，每小时动一动最管用。\n\n【适合提前准备】\n出发前在包里放一双弹力袜、一杯水、一张\"活动提醒\"便利贴；有长期用药的，药随身带、别托运。\n\n【一句话总结】\n长途飞行护腿不难：每小时动一动、多喝水、座位上勾勾脚，落地就轻松。", "moments": "昨天送机一位长辈，十几个小时飞欧洲，临走我多嘴一句：飞机上别一直睡，每小时起来走两步、勾勾脚踝、多喝点水。长途飞行腿不动容易肿，严重的还伤血管。带双弹力袜、设个喝水提醒，比什么偏方都实在。常飞的朋友们，这招真值得记一下 👟"}, {"day": "周四", "column": "目的地推荐", "topic": "英国", "short": "今天给大家推荐英国。夏天这里气温二十度上下，不燥热，正好逛伦敦的博物馆、沿泰晤士河走走，再坐火车去湖区看绿野湖泊，节奏慢又凉快，适合怕热的长辈。", "group": "【今日目的地】\n英国夏天，避暑慢游刚好\n\n【适合谁】\n1. 怕热、想夏天找个凉快地方，又想看城市与田园的人。\n2. 喜欢历史、博物馆、小镇慢逛，不追极限景点。\n3. 想一次看伦敦地标 + 英格兰湖区 / 苏格兰，节奏不赶。\n\n【为什么值得去】\n很多人以为英国总下雨阴冷，其实它夏天（6–8 月）最舒服：气温多在 20 度上下，凉爽不燥，正是逛城、走湖区的好时候。\n而且英国的\"慢\"很有内容：伦敦的博物馆免费进、泰晤士河慢慢走；往北是英格兰湖区的绿野与湖泊，再往北是爱丁堡的城堡老城。\n\n【主要看什么】\n伦敦：大本钟、威斯敏斯特、泰晤士河、大英博物馆（免费）。\n英格兰湖区：温德米尔湖、格里特布尔山间小镇，适合散步坐船。\n爱丁堡：城堡、老城石板路、王子街。\n科茨沃尔德：蜜色石墙小镇，英伦田园的代表。\n\n【特色体验】\n早上在伦敦街头走走，大本钟旁看泰晤士河船来船往；中午钻进博物馆吹空调看展品；下午坐火车去湖区，傍晚在湖边小镇吃顿热乎的，窗外是绿野和羊群。夏天不热，走多久都不黏。\n\n【建议玩几天】\n英国一地或英国 + 爱尔兰，安排 10–12 天比较舒服。城市间靠火车，建议含交通的通票或当地参团，少折腾。\n\n【预算参考】\n跟团游（含机票）：携程参考约 22000 元/人起（常见 22000–38000 元/人，淡旺季浮动）。\n定制小团 / 轻奢小团：约 38000 元/人起（常见 38000–48000 元/人）。\n具体价格看出发日期、航班、酒店和天数。\n\n【不适合谁】\n期待\"热带海岛、天天晒太阳\"的人——英国夏天凉，晴天也多为二十度出头。\n\n【一句话总结】\n英国夏天值得去的，是那种\"二十度出头不燥热，城市博物馆和绿色湖区都能慢慢看\"的清爽。", "moments": "夏天太热的时候，我反而会想起英国。六到八月那边气温就二十度上下，不燥，逛伦敦大英博物馆吹空调，沿泰晤士河走走，再坐火车去湖区看绿野和湖，傍晚小镇吃顿热的。城市和大自然都能慢慢看，还不黏身。想了解怎么走省心，私信我 🇬🇧"}, {"day": "周五", "column": "全球景点与体验", "topic": "北海道花海", "short": "今天给大家介绍北海道夏日的花海。富良野和美瑛的花田从七月开到八月，八月正是连片向日葵和彩色花田最盛的时候，气候凉快、平缓好走，坐车串几个点就能看个够，很适合想轻松看景的朋友。", "group": "【今日体验】\n北海道花海，八月向日葵最盛\n\n【为什么特别】\n很多人以为北海道只有冬天滑雪，其实它夏天才是\"花的季节\"。富良野和美瑛的花田从六月一直开到八月：七月是薰衣草的紫，八月接力的是连片向日葵和彩色花田，空气凉、颜色亮，看一眼就松快。\n而且这里不累——花田大多平缓好走，坐观光车或包车串几个点就行，适合不想爬山的季节。\n\n【特色体验】\n站在富田农场的花田边，紫色薰衣草（早八月还有晚开品种）和七彩花毯铺满山坡；转去美瑛，白金青池的蓝、四季彩之丘的色块像打翻的调色盘。风一吹，整片花浪晃一下，凉丝丝的。\n\n【适合谁】\n1. 想夏天找个凉快地方看风景、拍照，又不想要高强度走路的人。\n2. 喜欢花田、田园、小火车和安静小镇的慢游者。\n3. 亲子或长辈同行，需要平缓好走的线路。\n\n【最佳时间】\n七月中旬到八月是主花期；八月以向日葵和彩色花田最盛，气候也最舒服（白天二十度上下）。\n\n【怎么到达或怎么安排】\n如果您是自由行，从札幌出发可以参加富良野美瑛一日游或包车，不用自己开车赶路；夏季限定的观光列车也能体验。这个体验适合放进北海道整线，或作为札幌周边的一日游安排。\n\n【预算参考】\n札幌出发富良野美瑛一日游（含交通 + 中文导游）：携程参考约 330 元/人起（常见 330–600 元/人）。\n私人包车（4–5 座）：约 2000 元/车/天起（常见 2000–2800 元/车）。\n\n【需要注意】\n薰衣草盛花期在七月中下旬，八月多为向日葵与晚开品种，出发前看当年花况再定具体日子。\n部分花田和停车场收费，带点现金或电子支付更稳。\n\n【适合搭配哪条线路】\n适合放进\"北海道全景\"跟团或定制游；若只在札幌周边，单独一日游就能看个够。\n\n【一句话总结】\n北海道花海值得看的，是八月那片不燥热、平缓好走、紫与金接力铺开的夏天。", "moments": "前阵子排北海道线路，越看越觉得夏天去比冬天更惊喜。富良野美瑛的花田从七月开到八月，八月这会儿连片向日葵和七彩花田正盛，气温才二十度上下，不燥。花田大多平缓好走，坐车串几个点就够，白金青池的蓝、四季彩之丘的色块像打翻的调色盘。想轻松看景的朋友，这趟真可以私信我聊聊 🌻"}];

};const nav=document.getElementById("dayNav"),cards=document.getElementById("cards"),title=document.getElementById("pageTitle"),subtitle=document.getElementById("pageSubtitle"),imageNote=document.getElementById("imageNote"),toast=document.getElementById("toast"),copyAll=document.getElementById("copyAll");let current=0;function copyText(value,button){navigator.clipboard.writeText(value).then(()=>{const old=button.textContent;button.textContent="已复制";button.classList.add("copied");toast.classList.add("show");setTimeout(()=>{button.textContent=old;button.classList.remove("copied");toast.classList.remove("show")},1300)})}function card(label,value,brief=false){const article=document.createElement("article");article.className=brief?"card brief":"card";const header=document.createElement("header"),heading=document.createElement("h3"),button=document.createElement("button"),area=document.createElement("textarea");heading.textContent=label;button.className="copy-btn";button.textContent="复制文案";button.addEventListener("click",()=>copyText(value,button));area.value=value;area.setAttribute("aria-label",label);header.append(heading,button);article.append(header,area);return article}function render(index){current=index;const item=week[index];[...nav.children].forEach((button,i)=>button.classList.toggle("active",i===index));title.textContent=`${item.day}｜${item.column}`;subtitle.textContent=item.topic;imageNote.textContent=notes[item.day];cards.replaceChildren(card("简短群发版",item.short,true),card("群发版",item.group),card("朋友圈版",item.moments))}week.forEach((item,index)=>{const button=document.createElement("button");button.innerHTML=`<span class="day">${item.day} · ${item.column}</span><span class="topic">${item.topic}</span>`;button.addEventListener("click",()=>render(index));nav.append(button)});copyAll.addEventListener("click",()=>{const item=week[current];copyText(`【简短群发版】
${item.short}

【群发版】
${item.group}

【朋友圈版】
${item.moments}`,copyAll)});render(0);</script></body></html>
