<script>const week=[{"day": "周一", "column": "邮轮玩法", "topic": "阿拉斯加邮轮", "short": "今天给大家介绍阿拉斯加邮轮。船会驶进没有公路的冰川水道，雪山、浮冰和瀑布从甲板两侧展开；选航线时最关键的，不是船有多大，而是它到底去不去冰川湾。", "group": "【今日主题】\n阿拉斯加邮轮，驶进冰川深处\n\n【适合谁】\n1. 想看冰川、雪山和野生动物，但不想连续坐车、频繁换酒店。\n2. 能接受长途飞行，希望把体力留给真正值得看的岸上体验。\n3. 喜欢安静看风景，对购物和船上热闹项目没有太高要求。\n\n【这条玩法是什么】\n常见航线从西雅图或温哥华出发，邮轮约 7 晚，经过阿拉斯加内湾航道，停靠朱诺、凯奇坎、史凯威等港口。\n\n但“阿拉斯加邮轮”不等于一定进入冰川湾。美国国家公园管理局明确提醒，很多航线并不造访冰川湾，选船前要先看具体航线表。\n\n【主要亮点】\n如果航线进入冰川湾，邮轮通常会用大半天在湾内航行，不靠岸，而是沿着水道深入潮汐冰川附近。\n\n两边几乎没有公路和城市，巨大的山壁、冰川和海面会让十几层高的邮轮都显得很小。\n\n【特色体验】\n清晨裹着外套站上甲板，海面上漂着碎冰，远处的冰川泛着淡蓝色。船慢下来以后，大家会自然安静，等着听冰层开裂的低响。\n\n运气好时可能看到座头鲸、海獭或海鸟，但野生动物和冰川崩落都不能保证。\n\n【建议怎么玩】\n邮轮本身约 7 晚，加上往返航班和登船前后城市，完整行程安排 10—13 天比较合适。\n\n选产品时先看是否进入冰川湾，再看靠港时间、岸上观光和房型，不要只比较船龄和吨位。\n\n【预算参考】\n内舱房船票：约 7200—11500 元/人。\n\n海景房船票：约 9100—14300 元/人。\n\n阳台房船票：约 12500—21200 元/人。\n\n含国际机票及前后城市的 10—13 天产品：约 38900—62000 元/人。\n\n以上船票按含港务税费估算，纯船票不含岸上观光。\n\n【需要注意】\n阿拉斯加天气变化快，同一天可能经历阳光、风和小雨。签证要求则要根据登船港和停靠港确认，常见线路会同时涉及美国和加拿大。\n\n【一句话总结】\n阿拉斯加邮轮真正值得选的，是那条能把您送进冰川深处的航线。", "moments": "【今日主题】\n阿拉斯加邮轮，驶进冰川深处\n\n阿拉斯加最难忘的，不一定是下船后的某个景点，而是船突然慢下来的一天。\n\n前方不再有城市，只有雪山、海面和泛着淡蓝色的潮汐冰川。十几层高的邮轮驶进峡湾，在巨大的山壁面前也像一只小船。\n\n【一个容易忽略的区别】\n不是所有写着“阿拉斯加”的邮轮都会进入冰川湾。有些只是经过内湾、停靠港口；真正进入冰川湾的航线，通常会用 9—10 小时在湾内航行。\n\n所以选船时，先看航线去哪里，再看坐哪艘船。\n\n【适合怎样的人】\n想看冰川和野生动物，又不愿天天换酒店；能够接受长途飞行，希望到了以后把节奏放慢；比起购物，更愿意坐在甲板上等一片风景出现。\n\n【预算参考】\n内舱房船票约 7200—11500 元/人。\n\n海景房船票约 9100—14300 元/人。\n\n阳台房船票约 12500—21200 元/人。\n\n含国际机票及前后城市的 10—13 天产品约 38900—62000 元/人。\n\n以上船票按含港务税费估算，纯船票不含岸上观光。\n\n【出发前提醒】\n野生动物和冰川崩落无法保证，天气也可能随时变化。真正好的期待，不是要求大自然按时表演，而是给自己一整天，安静看船驶进没有公路的地方。"}, {"day": "周二", "column": "目的地推荐", "topic": "槟城＋怡保", "short": "今天给大家推荐槟城和怡保。走过乔治市老街，华人宗祠、印度庙、清真寺和南洋骑楼接连出现；再去怡保喝杯白咖啡，像走进我们熟悉又陌生的旧南洋。", "group": "【今日目的地】\n槟城怡保，走进南洋旧时光\n\n【适合谁】\n1. 喜欢老街、旧建筑和地方小吃，但不想每天赶很多景点。\n2. 第一次去东南亚，希望饮食和语言相对容易适应。\n3. 愿意上午逛一段、午后休息，避开最晒最热的时间。\n\n【为什么值得去】\n很多人以为槟城只是一座华人老城，其实乔治市最特别的地方，是中国、印度、马来、阿拉伯和欧洲文化在港口相遇了几百年。\n\n沿着老街走，可能刚经过华人宗祠，转角就是印度庙、清真寺和殖民时期建筑。这里的多元文化不是摆进博物馆里的，而是仍然有人在里面生活、祭拜、做生意。\n\n【主要看什么】\n槟城重点看乔治市历史街区、姓氏桥、娘惹老宅和升旗山；怡保可以看旧街场、白咖啡老店和藏在石灰岩山里的洞穴寺庙。\n\n【特色体验】\n早上趁街道还凉快，沿着骑楼慢慢走。旧招牌、花砖地面和半开的木窗从身边掠过，空气里一会儿是咖喱香，一会儿又是咖啡和烤面包的味道。\n\n到了怡保，坐进一间老咖啡店，点杯白咖啡，看老人读报、街坊聊天，会发现这里最动人的不是某个“大景点”，而是旧日生活还在继续。\n\n【建议玩几天】\n槟城安排 3—4 天，怡保安排 1—2 天，加上往返交通，5—7 天比较舒服。\n\n【预算参考】\n经济型跟团游：约 4400—5300 元/人。\n\n常规纯玩团：约 5800—7100 元/人。\n\n精品小团：约 7200—8600 元/人。\n\n4 人定制游：舒适档约 7600—9200 元/人；精品档约 9700—12100 元/人。\n\n2 人定制游：舒适档约 8900—10600 元/人；精品档约 11200—13800 元/人。\n\n以上为当前 7—8 月 5—7 天、含国际机票参考价。\n\n【不适合谁】\n如果特别怕湿热、不喜欢街巷步行，或者只期待海岛沙滩，这条线路可能不够合适。\n\n【一句话总结】\n槟城和怡保不是去看一座复制出来的古城，而是去看南洋生活怎样留在今天。", "moments": "【今日目的地】\n槟城怡保，走进南洋旧时光\n\n乔治市最有意思的地方，是走着走着，熟悉感会突然变成新鲜感。\n\n一边是写着汉字的宗祠和骑楼，另一边传来印度庙的铃声；再走几步，香料、咖喱、咖啡和烤面包的味道混在一起。这里不是单一的“华人老城”，而是一座被五百年海上贸易慢慢塑造出来的多元港口。\n\n【为什么还要去怡保】\n怡保和槟城不一样。石灰岩山贴着城市生长，寺庙藏进洞穴里；旧街场的咖啡店还保留着慢悠悠的节奏，一杯白咖啡就能坐上一阵子。\n\n【怎样安排更舒服】\n槟城 3—4 天，怡保 1—2 天。上午逛老街，下午回酒店休息，傍晚再出来吃饭，不必把每天排满。\n\n【预算参考】\n经济型跟团游约 4400—5300 元/人。\n\n常规纯玩团约 5800—7100 元/人。\n\n精品小团约 7200—8600 元/人。\n\n4 人定制游：舒适档约 7600—9200 元/人；精品档约 9700—12100 元/人。\n\n2 人定制游：舒适档约 8900—10600 元/人；精品档约 11200—13800 元/人。\n\n以上为当前 7—8 月 5—7 天、含国际机票参考价。\n\n【适合怎样的人】\n喜欢老街和地方饮食，愿意在一座城市里慢慢看生活；又希望第一次东南亚旅行不要太陌生、太折腾的人，会比较容易喜欢这里。"}, {"day": "周三", "column": "安心出行小贴士", "topic": "长途飞行怎样减少腿肿", "short": "今天给大家介绍长途飞行减少腿肿的方法。关键不是等下飞机再走，而是飞行途中每隔一段时间起身活动，并在座位上反复勾脚尖、转脚踝，让小腿一直动起来。", "group": "【今日提醒】\n长途飞行腿肿，别一直坐着\n\n【为什么重要】\n长途飞行超过 4 小时，人在狭小座位上久坐不动，腿部血液回流会变慢。\n\n多数人只是暂时发胀，但如果出现单侧小腿明显肿痛、发热，或者同时胸痛、呼吸困难，就不能只当成普通疲劳。\n\n【具体怎么做】\n1. 在安全允许时，每隔 1—2 小时起身走动一次。\n2. 坐着时反复勾脚尖、踩脚尖、转动脚踝，并收紧再放松小腿肌肉。\n3. 能选座时优先考虑过道位，更容易起身活动。\n4. 不要把随身行李塞满脚下，给双腿留出活动空间。\n5. 不要为了睡觉一直保持同一个姿势到落地。\n\n【容易忽略的细节】\n以前得过血栓、近期做过手术、正在接受肿瘤治疗，或医生曾提醒有血栓风险的人，出发前要先咨询医生。\n\n弹力袜、抗凝药和阿司匹林都不适合自己随意决定。\n\n【适合提前准备】\n登机前把必须服用的药放在随身包里，穿不勒腿的衣裤和鞋袜，并提前设一个活动提醒。\n\n个人病史不同，具体预防方法以医生建议为准。\n\n【一句话总结】\n长途飞行少腿肿，最实用的办法就是别让小腿一路闲着。", "moments": "【今日提醒】\n长途飞行腿肿，别一直坐着\n\n坐十几个小时飞机，最累的不一定是腰，而是一直没有机会活动的小腿。\n\n久坐会让腿部血液回流变慢。美国疾控中心建议，长途旅行中要经常活动双腿，并尽量每隔 1—2 小时走动一次。\n\n【在座位上也能做】\n反复勾脚尖、踩脚尖、转脚踝，再把小腿肌肉收紧、放松。动作不大，但比一路保持同一个姿势更好。\n\n能选座时，可以优先选过道位；脚下也不要塞得太满，让双腿有活动空间。\n\n【哪些情况要提前问医生】\n以前得过血栓、近期做过手术、正在接受肿瘤治疗，或已经被医生提醒有血栓风险，都应在出发前咨询医生。\n\n弹力袜、抗凝药和阿司匹林，不要自行决定。\n\n【需要警惕】\n如果出现单侧小腿明显肿痛、发热，或者胸痛、呼吸困难，应及时就医。\n\n每个人的身体情况不同，今天这份提醒用于一般旅行准备，具体方案仍以医生建议为准。"}, {"day": "周四", "column": "目的地推荐", "topic": "阿拉木图", "short": "今天给大家推荐阿拉木图。它不是想象中一望无际的草原城市，绿树街道的尽头就是天山雪峰；再坐车出城，红色峡谷、蓝色高山湖和水下森林会依次出现。", "group": "【今日目的地】\n阿拉木图，城市尽头是雪山\n\n【适合谁】\n1. 去过一些成熟热门国家，想看一个仍有陌生感的中亚目的地。\n2. 喜欢雪山、湖泊和峡谷，但不追求高强度徒步。\n3. 能接受远郊景点车程较长、部分山地设施比较朴素。\n\n【为什么值得去】\n很多人想到哈萨克斯坦，脑海里只有草原。阿拉木图却是一座被天山挡在身后的绿树城市，走在市中心，抬头就能看见雪峰。\n\n这里还被称为苹果的故乡。城市名称本身就和苹果有关，天山一带生长着现代栽培苹果的重要野生祖先。\n\n【主要看什么】\n市区可以看升天大教堂、绿色巴扎、潘菲洛夫公园和山脚下的麦迪奥、琼布拉克。\n\n远郊重点是红色岩壁层层展开的恰伦峡谷、像深蓝宝石一样的科尔赛湖，以及枯木从湖面伸出的凯因迪湖。\n\n【特色体验】\n早上还在城市树荫下喝咖啡，下午已经站在峡谷边。阳光落在红色岩壁上，沟壑一层层亮起来，像大地突然裂开一道巨大的口子。\n\n换一天去高山湖，雪峰和冷杉倒映在深蓝水面。凯因迪湖里，沉入水中的云杉树干仍从湖面伸出，远看像一片安静的水下森林。\n\n【建议玩几天】\n第一次去安排 6—9 天比较合适。市区留 2 天，峡谷和湖泊不要全部挤在同一天，长车程会明显影响体验。\n\n【预算参考】\n普通跟团游：约 5000 元/人起。\n\n含国际机票的拼小团：约 11000—14000 元/人。\n\n独立定制游：通常约 18000 元/人起，2 人出行或暑期旺季会更高。\n\n具体价格看出发日期、航班、酒店、人数和行程安排；低价产品是否包含国际机票，需要看具体费用说明。\n\n【不适合谁】\n不能接受单日较长车程、山地高差和景区厕所餐饮条件较简单的人，不适合把远郊湖泊全部排进去。\n\n【一句话总结】\n阿拉木图的惊喜，是一座城市背后，同时藏着雪山、峡谷和高山湖。", "moments": "【今日目的地】\n阿拉木图，城市尽头是雪山\n\n很多人以为哈萨克斯坦只有草原。真正走进阿拉木图，却会先看见满城绿树，以及街道尽头压得很低的天山雪峰。\n\n这座城市还和苹果有很深的关系。天山一带生长着现代栽培苹果的重要野生祖先，阿拉木图的名字本身也带着“苹果之地”的意味。\n\n【出城以后看什么】\n恰伦峡谷的红色岩壁被风雨刻出层层沟壑；科尔赛湖像一块落在冷杉林里的深蓝宝石；凯因迪湖则把一片云杉森林藏进水下，只留下灰白树干伸出湖面。\n\n【怎样安排更合适】\n第一次去安排 6—9 天。市区 2 天，峡谷和湖泊分开安排，不要为了多看几个地方，把一天变成长时间坐车。\n\n【预算参考】\n普通跟团游约 5000 元/人起。\n\n含国际机票的拼小团约 11000—14000 元/人。\n\n独立定制游通常约 18000 元/人起，2 人出行或暑期旺季会更高。\n\n具体价格看出发日期、航班、酒店、人数和行程安排；低价产品是否包含国际机票，需要看具体费用说明。\n\n【适合怎样的人】\n想看一个还不那么熟悉的世界，同时愿意接受长车程、山地高差和较朴素设施的人，会在这里得到很多新鲜感。"}, {"day": "周五", "column": "全球景点与体验", "topic": "青森睡魔祭", "short": "今天给大家介绍青森睡魔祭。夜色里，接近两层楼高的武将和神怪灯笼被人推上街，随着鼓点迎面转来；这不是站着看灯会，而是看整座城市跟着灯火移动。", "group": "【今日体验】\n青森睡魔祭，巨型灯笼活起来\n\n【为什么特别】\n它不是把灯笼摆在广场上供人参观，而是把巨大的武将、神怪和歌舞伎人物推上街道巡游。\n\n大型睡魔灯笼宽可达 9 米、高约 5 米。灯从内部亮起以后，夸张的眼神、盔甲和肌肉都像突然有了生命。\n\n【特色体验】\n夜色落下，第一阵太鼓声从街口传来。巨型灯笼缓缓逼近，在路口突然转身，武将的脸几乎扑到观众面前。\n\n旁边的跳人跟着笛声和鼓点不断跳跃，整条街一遍遍响起“Rassera”的喊声。您看到的不只是一盏灯，而是一件会移动、会转身、会与整座城市一起呼吸的作品。\n\n【适合谁】\n1. 去过日本多次，想遇见一个只有特定日期才有的现场。\n2. 喜欢传统工艺、历史人物和大型节庆场面。\n3. 希望坐着看完整巡游，愿意提前预订观览席并接受散场人流。\n\n【最佳时间】\n2026 年青森睡魔祭为 8 月 2 日至 7 日。\n\n8 月 4 日至 6 日以大型睡魔夜间巡游为主；8 月 6 日可看到获奖睡魔，8 月 7 日晚上还有海上巡游和烟花。\n\n【怎么到达或怎么安排】\n从东京可乘东北新干线到新青森，再换乘 JR 前往青森市区。巡游路线从 JR 青森站步行约 10 分钟可达。\n\n可以单订观览席，也可以把它放进日本东北多城线路，前后搭配弘前、奥入濑溪流和十和田湖。携程侧观览席、短期游和中文服务数量都不多，需要按日期提前查询。\n\n【需要注意】\n节日期间酒店和观览席紧张，现场是夏季户外夜场，仍要准备防暑和舒适鞋子。没有买到观览席也能沿路线观看，但站立时间和人流会更多。\n\n【适合搭配哪条线路】\n适合放进 5—8 天日本东北线路，也可以和弘前、秋田、盛冈或仙台串联。\n\n【一句话总结】\n青森睡魔祭最难忘的，是那些纸与灯做成的巨人，真的从夜色里向您走来。", "moments": "【今日体验】\n青森睡魔祭，巨型灯笼活起来\n\n夜里七点，鼓声从街道另一端传来。接近两层楼高的武将灯笼慢慢亮起，被人推着向前移动。\n\n它经过路口时突然转身，夸张的眼睛、盔甲和手臂几乎迎面压过来；跳人围在四周，伴着笛声和太鼓不断高喊“Rassera”。这一刻，整座城市都被灯火和节奏带着往前走。\n\n【它不是普通灯会】\n大型睡魔宽可达 9 米、高约 5 米，多以武将、历史人物和歌舞伎形象为主题。它们不是静静摆放，而是在街道上巡游、转向，与观众不断靠近。\n\n【什么时候去】\n2026 年活动为 8 月 2 日至 7 日。8 月 4 日至 6 日主要是大型睡魔夜间巡游，6 日还能看到获奖作品；7 日晚上是海上巡游和烟花。\n\n【怎么安排】\n可以单订观览席，也可以把它放进日本东北 5—8 天线路，前后搭配弘前、奥入濑溪流和十和田湖。\n\n携程侧观览席、当地短期游和中文服务数量有限，需要按具体日期查询。没有观览席也能沿路线观看，但需要面对更长的站立时间和人流。\n\n真正值得专门赶赴一座城市的节日，是多年以后再听见鼓声，眼前仍会浮现那张从夜色里亮起来的巨大面孔。"}];const notes={"周一":"阿拉斯加邮轮：6张3:4实景图 + 裁剪前原图","周二":"槟城＋怡保：6张3:4实景图 + 裁剪前原图","周三":"长途飞行腿肿：1张可保存的3:4大字提醒图","周四":"阿拉木图：6张3:4实景图 + 裁剪前原图","周五":"青森睡魔祭：6张3:4实景图 + 裁剪前原图"};const nav=document.getElementById("dayNav"),cards=document.getElementById("cards"),title=document.getElementById("pageTitle"),subtitle=document.getElementById("pageSubtitle"),imageNote=document.getElementById("imageNote"),toast=document.getElementById("toast"),copyAll=document.getElementById("copyAll");let current=0;function copyText(value,button){navigator.clipboard.writeText(value).then(()=>{const old=button.textContent;button.textContent="已复制";button.classList.add("copied");toast.classList.add("show");setTimeout(()=>{button.textContent=old;button.classList.remove("copied");toast.classList.remove("show")},1300)})}function card(label,value,brief=false){const article=document.createElement("article");article.className=brief?"card brief":"card";const header=document.createElement("header"),heading=document.createElement("h3"),button=document.createElement("button"),area=document.createElement("textarea");heading.textContent=label;button.className="copy-btn";button.textContent="复制文案";button.addEventListener("click",()=>copyText(value,button));area.value=value;area.setAttribute("aria-label",label);header.append(heading,button);article.append(header,area);return article}function render(index){current=index;const item=week[index];[...nav.children].forEach((button,i)=>button.classList.toggle("active",i===index));title.textContent=`${item.day}｜${item.column}`;subtitle.textContent=item.topic;imageNote.textContent=notes[item.day];cards.replaceChildren(card("简短群发版",item.short,true),card("群发版",item.group),card("朋友圈版",item.moments))}week.forEach((item,index)=>{const button=document.createElement("button");button.innerHTML=`<span class="day">${item.day} · ${item.column}</span><span class="topic">${item.topic}</span>`;button.addEventListener("click",()=>render(index));nav.append(button)});copyAll.addEventListener("click",()=>{const item=week[current];copyText(`【简短群发版】

${item.moments}`,copyAll)});render(0);</script></body></html>
