<script>const week=[{"day": "周一", "column": "邮轮玩法", "topic": "加勒比海邮轮", "short": "今天给大家介绍加勒比海邮轮。一条船玩十来天，白天靠岸去玛雅遗址、粉色沙滩这些地方，晚上回船上吃大餐看演出，不用天天换酒店、不用自己拖箱子赶路。", "group": "【今日主题】\n加勒比海邮轮，一船玩转海岛\n\n【适合谁】\n1. 想一次看好几座热带海岛，又不想自己查航班、换酒店、拖行李的人。\n2. 喜欢“白天上岸玩、晚上回船歇”的慢节奏，不想赶夜路。\n3. 同行有人步速不一，想有个固定“移动酒店”兜底的长辈。\n\n【这条玩法是什么】\n加勒比海邮轮是大海邮轮，常见 7–10 晚，从美国迈阿密、劳德代尔堡等港口登船，串起巴哈马、墨西哥加勒比沿岸、波多黎各等港口。\n关键：每天醒来已经停在另一座海岛边，下船就能玩，省掉岛间交通和搬行李的麻烦。\n\n【主要亮点】\n清晨在甲板上看海平线慢慢亮起来；白天上岸，走进墨西哥的玛雅金字塔、巴哈马的粉色沙滩和清澈海水；傍晚回船，吃顿饭、看场演出，船趁夜开向下一座岛。\n\n【特色体验】\n早上在房间阳台看加勒比海日出，海水是透亮的蓝绿色；中午在巴哈马的白沙滩上走走，踩着温热的海水；傍晚回船，甲板乐队响起，船已经离开港口、灯一串串退远。这种“不用自己安排交通，热带海岛却一座座送到眼前”的轻松，是陆路很难给的。\n\n【建议怎么玩】\n加勒比海一地 7–10 天轻松；想看更多可走东西加勒比不同航线。选产品看三点：从哪座城市登船、停靠哪些岛屿、含不含岸上观光和机票。\n\n【预算参考】\n邮轮船票（不含机票）：携程参考约 6000 元/人起（常见 6000–22000 元/人）；含机票跟团游：约 18000 元/人起（常见 18000–45000 元/人）。\n具体价格看出发日期、舱房、航期和团期。\n\n【需要注意】\n加勒比海航线多从美国港口出发，需办理美国签证；热带日照强，注意防晒和补水。\n船上医疗有限，有慢性病建议出发前评估、备好常用药。\n\n【一句话总结】\n加勒比海邮轮值得选的，是那种“不用自己安排交通，热带海岛却一座座送到眼前”的轻松。", "moments": "前阵子帮客户排线路，越看越觉得加勒比海这趟邮轮适合不想折腾的长辈。白天船靠岸，下去逛逛玛雅遗址、粉色沙滩这些地方；傍晚回船上吃个饭、看场演出，第二天睁眼，船已经停到下一座岛了。不用查航班，也不用拖箱子换酒店，真省心。\n\n---"}, {"day": "周二", "column": "目的地推荐", "topic": "意大利", "short": "今天给大家推荐意大利。罗马的斗兽场、佛罗伦萨的圣母百花、威尼斯的运河，坐火车就能串起来，文艺复兴的老城走起来不累，特别适合想看欧洲精华又怕麻烦的朋友。", "group": "【今日目的地】\n意大利，火车串起文艺复兴\n\n【适合谁】\n1. 想看欧洲经典老城、艺术与美食，但不想每天自驾、换酒店的人。\n2. 喜欢慢节奏：一座城住下，坐火车去周边 day trip。\n3. 想一次看罗马、佛罗伦萨、威尼斯、还有托斯卡纳的田园，又不追高强度打卡。\n\n【为什么值得去】\n很多人以为意大利只是“披萨和古迹”，其实它最厉害的是把上千年的艺术和生活揉在一起——罗马的斗兽场、佛罗伦萨的乌菲兹、威尼斯的运河，坐火车就能串起来。\n而且意大利不大，住两三个城、靠火车 day trip，就能把文艺复兴看个遍，行李不用动。\n\n【主要看什么】\n罗马：斗兽场、许愿池、梵蒂冈。\n佛罗伦萨：圣母百花大教堂、老桥、乌菲兹美术馆。\n威尼斯：运河、圣马可广场、彩色布拉诺岛。\n托斯卡纳：田园小镇与葡萄园，慢生活的样子。\n\n【特色体验】\n早上在罗马许愿池边喝杯咖啡，斗兽场就在身后；中午坐火车到佛罗伦萨，抬头看圣母百花的红顶；傍晚到威尼斯，坐一段小船钻进小巷。这种“住一处、火车串着看”的节奏，对长辈特别友好。\n\n【建议玩几天】\n意大利一地 10–12 天舒服；加法瑞或希腊连线 12–15 天。城市之间靠火车，建议含欧铁票，少自己开长途。\n\n【预算参考】\n跟团游（含机票）：携程参考约 18000 元/人起（常见 18000–32000 元/人）。\n定制小团：约 25000 元/人起（常见 25000–55000 元/人）。\n具体价格看出发城市、航班、酒店和天数。\n\n【不适合谁】\n期待“低价长线、天天逛折扣店”的人——意大利节奏偏慢、景点预约多，不适合赶场。\n\n【一句话总结】\n意大利值得去的，是那种“不用开车、火车就把文艺复兴老城一座座串起来”的省心。", "moments": "想看欧洲精华又怕麻烦，我常推意大利。罗马斗兽场、佛罗伦萨圣母百花、威尼斯运河，坐火车就能串起来。住一个城、火车串着玩，文艺复兴的老城走起来不累，托斯卡纳的田园也顺道看看。对怕折腾的长辈特别友好。\n\n---"}, {"day": "周三", "column": "安心出行小贴士", "topic": "出国购物退税怎么退", "short": "今天给大家捋一下退税：在贴有 Tax Free 标识的店买东西，结账时拿退税单，离境时在机场海关盖章、再投进邮筒或退税点，钱能退回卡里或当场拿现金，省下的不是小数目。", "group": "【今日提醒】\n出国购物，退税别漏了\n\n【为什么重要】\n很多 60/70 后出去玩爱买点当地好货，但常常“买了就走”，不知道还能退税。欧洲、日本、韩国、东南亚许多店都支持退税，退税率常在 8%–15%，一笔花几千块，退回来可能够吃顿好的。\n没办退税，等于白白多花了钱。\n\n【具体怎么做】\n1. 认准店里的“Tax Free”标识，结账时主动说要退税，出示护照，拿退税单（有的店直接退到卡，有的给单子）。\n2. 保留好小票，别在退税前把商品拆封使用。\n3. 离境时在机场找海关柜台，出示商品、小票和退税单盖章。\n4. 盖完章，把单子投进机场退税邮筒，或去退税点（如 Global Blue、Planet）领现金或退到卡。\n\n【容易忽略的细节】\n退税有门槛：单店消费常需满一定金额才能退，记得问清楚。\n退税单要在离境国盖章，转机别在中间国提前办；现金退税往往手续费高，退卡更划算。\n退税有期限，别把单子留到下次。\n\n【适合提前准备】\n出国前把护照、签证拍照存手机云端；记下常去国的退税门槛。大额购物集中在离境前一天，留足机场盖章时间。\n\n【一句话总结】\n退税不难：认 Tax Free、拿退税单、离境海关盖章、投筒或到点退，省下的钱真不少。", "moments": "提醒一句，出国买东西记得退税。贴 Tax Free 标识的店，结账时拿退税单，离境在机场海关盖章、再投邮筒或去退税点，钱能退回卡或当场拿现金，退税率常有一成上下。别买了就走，白白多花一笔。常出门买买买的存一下。\n\n---"}, {"day": "周四", "column": "目的地推荐", "topic": "埃及", "short": "今天给大家推荐埃及。金字塔和狮身人面像不用多说，尼罗河上坐船看神庙，撒哈拉边缘的卢克索像露天的历史书，趁身子骨好去看看，是很多人清单里的一项。", "group": "【今日目的地】\n埃及，尼罗河串起千年文明\n\n【适合谁】\n1. 想看金字塔、神庙这些“世界奇迹级”地标，列入人生清单的人。\n2. 喜欢慢节奏：沿尼罗河坐船，两岸神庙一座座看过去。\n3. 想一次看开罗、卢克索、阿斯旺，又不追高强度赶场的人。\n\n【为什么值得去】\n很多人以为埃及只是“沙漠和金字塔”，其实它最神的是尼罗河——几千年的文明都沿河铺开。从开罗的金字塔，到卢克索的 Karnak 神庙、帝王谷，再到阿斯旺的菲莱神庙，坐船就能串起来。\n这种“活着的历史”密度，全世界没几个地方比得了。\n\n【主要看什么】\n开罗：吉萨金字塔群、狮身人面像、埃及博物馆。\n卢克索：Karnak 神庙、帝王谷、尼罗河两岸。\n阿斯旺：菲莱神庙、尼罗河风光。\n红海：如果想加一段海边休息，沙姆沙伊赫很舒服。\n\n【特色体验】\n清晨在吉萨看金字塔被朝阳染金；中午到卢克索，走进 Karnak 那种巨柱林立的神庙；傍晚坐尼罗河的小船，看两岸从金红暗下去。这种“几千年文明就在眼前”的震撼，是别处给不了的。\n\n【建议玩几天】\n埃及一地 10–12 天舒服；加迪拜或土耳其连线 12–15 天。境内以包车+内飞+尼罗河游船为主，建议含中文向导，少自己开长途。\n\n【预算参考】\n跟团游（含机票）：携程参考约 12000 元/人起（常见 12000–25000 元/人）。\n定制/深度游：约 18000 元/人起（常见 18000–40000 元/人）。\n具体价格看出发城市、航班、酒店和天数。\n\n【不适合谁】\n怕热、怕早起赶行程的人——埃及白天日照强、部分景点需早出；对历史没兴趣的也难打动。\n\n【一句话总结】\n埃及值得去的，是那种“金字塔在晨光里、尼罗河把千年神庙一座座送到眼前”的震撼。", "moments": "想看世界奇迹，我常提埃及。吉萨金字塔、狮身人面像不用多说，沿尼罗河坐船，两岸 Karnak 神庙、帝王谷一座座看过去，像翻一本露天的历史书。趁身子骨好去看看，是很多朋友清单里的一项。\n\n---"}, {"day": "周五", "column": "全球景点与体验", "topic": "北极光", "short": "今天给大家介绍北极光。九月的夜开始够长，去挪威、冰岛、芬兰这些地方，运气好就能看到天上绿色的光在动，像大自然放的烟花，很多人说这辈子得亲眼看一次。", "group": "【今日体验】\n北极光，夜空里的舞\n\n【为什么特别】\n很多人以为北极光只是“绿色的光”，其实它最神的是那种流动——像被风吹动的帘幕，在黑色夜空里慢慢展开、又散开。\n九月初秋，北欧的夜开始够长，正是追极光季的开头。这种“天地之间忽然安静、只剩光在动”的瞬间，是它让人上头的原因。\n\n【特色体验】\n傍晚天暗下来，向导带着去光污染少的地方守着；先是一点淡淡的绿，慢慢铺成一片，像在水里晃；有时还掺进紫和粉。站在雪地或湖边，四周静得只剩自己的呼吸，光在头顶慢慢游。\n\n【适合谁】\n1. 想看一处“人生清单级”的自然奇景，而不是只逛城市的人。\n2. 喜欢清冷、安静、有一点传奇色彩，节奏不赶的人。\n3. 长辈同行也合适——很多极光团提供暖房、热饮，不必一直冻着等。\n\n【最佳时间】\n每年 9 月到次年 3 月是北极光季，夜越长机会越大。九月算早季，人少、天气也还没到最冷。具体看当地地磁活动和天气。\n\n【怎么到达或怎么安排】\n如果您是自由行，从挪威特罗姆瑟、冰岛、芬兰罗瓦涅米都有成熟的极光团，含接送、暖房和热饮，不用自己开车找黑的地方。这个体验适合放进“北欧”整线，或作为一程单独安排。\n\n【预算参考】\n北欧追极光跟团游（含机票）：携程参考约 18000 元/人起（常见 18000–40000 元/人），视国家、天数和是否含圣诞村等附加体验而定。\n\n【需要注意】\n极光看天吃饭，不能保证当晚一定出现；选含多晚守候的团，机会更大。\n北极圈秋夜已冷，保暖衣物、防滑鞋要带够；长辈量力慢行。\n\n【适合搭配哪条线路】\n适合放进“北欧五国+冰岛”或“挪威/芬兰”跟团/定制游；若只追极光，单独一程就能看个够。\n\n【一句话总结】\n北极光值得看的，是那种“夜空忽然安静、只剩绿色的光在头顶慢慢游”的瞬间。", "moments": "前阵子排北欧线路，越看越觉得北极光值得专程去。九月夜开始够长，去挪威、冰岛这些地方，运气好就能看到天上绿色的光在动，像大自然放的烟花。很多人说这辈子得亲眼看一次，趁九月人少天气还没最冷，去看看正好。"}];

};const nav=document.getElementById("dayNav"),cards=document.getElementById("cards"),title=document.getElementById("pageTitle"),subtitle=document.getElementById("pageSubtitle"),imageNote=document.getElementById("imageNote"),toast=document.getElementById("toast"),copyAll=document.getElementById("copyAll");let current=0;function copyText(value,button){navigator.clipboard.writeText(value).then(()=>{const old=button.textContent;button.textContent="已复制";button.classList.add("copied");toast.classList.add("show");setTimeout(()=>{button.textContent=old;button.classList.remove("copied");toast.classList.remove("show")},1300)})}function card(label,value,brief=false){const article=document.createElement("article");article.className=brief?"card brief":"card";const header=document.createElement("header"),heading=document.createElement("h3"),button=document.createElement("button"),area=document.createElement("textarea");heading.textContent=label;button.className="copy-btn";button.textContent="复制文案";button.addEventListener("click",()=>copyText(value,button));area.value=value;area.setAttribute("aria-label",label);header.append(heading,button);article.append(header,area);return article}function render(index){current=index;const item=week[index];[...nav.children].forEach((button,i)=>button.classList.toggle("active",i===index));title.textContent=`${item.day}｜${item.column}`;subtitle.textContent=item.topic;imageNote.textContent=notes[item.day];cards.replaceChildren(card("简短群发版",item.short,true),card("群发版",item.group),card("朋友圈版",item.moments))}week.forEach((item,index)=>{const button=document.createElement("button");button.innerHTML=`<span class="day">${item.day} · ${item.column}</span><span class="topic">${item.topic}</span>`;button.addEventListener("click",()=>render(index));nav.append(button)});copyAll.addEventListener("click",()=>{const item=week[current];copyText(`【简短群发版】
${item.short}

【群发版】
${item.group}

【朋友圈版】
${item.moments}`,copyAll)});render(0);</script></body></html>
