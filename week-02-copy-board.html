      const nav=document.querySelector("#dayNav"),pageTitle=document.querySelector("#pageTitle"),pageSubtitle=document.querySelector("#pageSubtitle"),cards=document.querySelector("#cards"),imageNote=document.querySelector("#imageNote"),copyBoth=document.querySelector("#copyBoth"),toast=document.querySelector("#toast");let activeIndex=0;
      function showToast(message){toast.textContent=message;toast.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove("show"),1600)}
      async function copyText(text,label,button){try{await navigator.clipboard.writeText(text)}catch(e){const helper=document.createElement("textarea");helper.value=text;helper.style.position="fixed";helper.style.left="-9999px";document.body.appendChild(helper);helper.select();document.execCommand("copy");helper.remove()} if(button){const old=button.textContent;button.textContent="已复制";button.classList.add("copied");setTimeout(()=>{button.textContent=old;button.classList.remove("copied")},1400)} showToast("已复制"+label)}
      function renderNav(){nav.innerHTML="";week.forEach((item,index)=>{const button=document.createElement("button");button.type="button";button.className=index===activeIndex?"active":"";button.innerHTML='<span class="day">'+item.day+"｜"+item.column+'</span><span class="topic">'+item.topic+"</span>";button.addEventListener("click",()=>{activeIndex=index;render()});nav.appendChild(button)})}
      function createCard(title,text){const card=document.createElement("article");card.className="card";const header=document.createElement("header");const heading=document.createElement("h3");heading.textContent=title;const button=document.createElement("button");button.type="button";button.className="copy-btn";button.textContent="复制";button.addEventListener("click",()=>copyText(text,title,button));header.append(heading,button);const area=document.createElement("textarea");area.value=text;area.spellcheck=false;area.addEventListener("focus",()=>area.select());card.append(header,area);return card}
      function render(){const item=week[activeIndex];renderNav();pageTitle.textContent=item.day+"｜"+item.column;pageSubtitle.textContent="今日选题："+item.topic;imageNote.textContent=item.image;cards.innerHTML="";cards.append(createCard("群发版",item.group),createCard("朋友圈版",item.moments))}
      copyBoth.addEventListener("click",()=>{const item=week[activeIndex];copyText("【群发版】\n\n"+item.group+"\n\n------------------------------\n\n【朋友圈版】\n\n"+item.moments,"当天两版",copyBoth)});
      render();
