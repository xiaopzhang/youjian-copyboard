    <style>
      :root{--bg:#f6f8f7;--panel:#fff;--text:#1f2c29;--muted:#65736f;--line:#d8e5e0;--accent:#0f5c55;--accent-dark:#0a403b;--accent-soft:#eaf5f2;--warn-soft:#fff8e8;--gold-soft:#fffaf0;--gold-line:#d8ccb0;--shadow:0 16px 40px rgba(17,42,38,.08)}
      *{box-sizing:border-box}
      body{margin:0;color:var(--text);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
      button,textarea{font:inherit}
      .shell{width:min(1080px,calc(100% - 32px));margin:0 auto;padding:36px 0 52px}
      .back{display:inline-flex;margin-bottom:20px;color:var(--accent);font-weight:800;text-decoration:none}
      .hero{padding:28px 0 22px;border-bottom:1px solid var(--line)}
      .eyebrow{margin:0 0 10px;color:var(--accent);font-size:17px;font-weight:900}
      h1{margin:0;color:var(--accent-dark);font-size:clamp(30px,5vw,48px);line-height:1.18;letter-spacing:0}
      .intro{max-width:780px;margin:16px 0 0;color:var(--muted);font-size:20px;line-height:1.75}
      .notice{margin:24px 0;padding:14px 16px;border:1px solid #e8d9a9;border-radius:8px;background:var(--warn-soft);color:#5f4b16;font-size:15px}
      .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
      .card{min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
      .card header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:#fbfdfc}
      h2{margin:0;color:var(--accent-dark);font-size:20px;line-height:1.3}
      .copy-btn{min-width:92px;min-height:38px;padding:0 14px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
      .copy-btn:hover{background:var(--accent-dark)}
      .copy-btn.copied{border-color:#2f8f68;background:#2f8f68}
      textarea{display:block;width:100%;min-height:920px;padding:18px;border:0;color:var(--text);background:#fff;resize:vertical;outline:none;white-space:pre-wrap;font-size:17px;line-height:1.78}
      .image-panel{padding:18px;border:1px solid var(--gold-line);border-radius:8px;background:var(--gold-soft)}
      .image-panel h2{margin-bottom:8px}
      .image-panel p{margin:0 0 14px;color:#665322;font-size:16px}
      .image-panel img{display:block;width:100%;max-width:900px;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
      .toast{position:fixed;right:22px;bottom:22px;padding:12px 14px;border-radius:8px;background:#173f3a;color:#fff;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:opacity .18s ease,transform .18s ease;pointer-events:none}
      .toast.show{opacity:1;transform:translateY(0)}
      @media(max-width:640px){.shell{width:min(100% - 24px,1080px);padding-top:22px}.intro{font-size:17px}textarea{min-height:760px;font-size:16px}.card header{align-items:flex-start;flex-direction:column}.copy-btn{width:100%}}
    </style>

          <textarea id="groupCopy" readonly>【特别推荐】
在首博，看玛雅人的宇宙

最近首都博物馆有一个很值得看的大展：
「玉米·黄金·美洲豹——玛雅与安第斯古代文明」。

展期到 2026 年 10 月 18 日，地点在首都博物馆 A、B、M 展厅及公共空间。

【为什么值得去】
这个展有意思的地方，不只是“文物多”。

它会把我们熟悉的东西，换一种方式重新打开：

玉米不只是粮食。
黄金不只是财富。
美洲豹也不只是动物。

这三个词，放进玛雅和安第斯文明里，背后都是他们理解世界的方式。

【三个看点】
1. 玉米：人从哪里来

在玛雅创世故事里，人是用黄色和白色玉米造出来的。

所以玉米对他们来说，不只是吃饭的问题，而是“人从哪里来”的答案。

展里可以看到很多玉米形象，还有英雄双子帮助玉米神从下界重生的线索。这个点很值得慢慢看。

2. 黄金：不是首饰，是权力和神性

安第斯文明里的黄金，不能只按“贵不贵”来理解。

比如展出的莫切文化金冠饰，中央有人面，带猫科动物特征，还结合贝壳、章鱼触手等形象。

这类金器和贵族的仪式、葬礼、神权等级有关。它不是单纯好看，而是在告诉别人：这个人有特殊身份，能连接人间、神灵和亡者世界。

3. 美洲豹：白天是太阳，夜里入下界

在玛雅人的宇宙观里，美洲豹很特别。

白天太阳照亮人间；到了夜里，太阳神会化身为有斑纹的美洲豹，进入下界。

所以美洲豹既代表力量，也和死亡、黑夜、重生有关。看懂这一点，再看展里的动物形象，会完全不一样。

【适合谁】
如果您以前去博物馆，常觉得“东西很好，但不知道怎么看”，这个展反而比较适合。

因为它不是让人死记年代，而是用玉米、黄金、美洲豹三个线索，把文明讲得比较好进入。

也适合对墨西哥、秘鲁、中美洲和南美洲旅行感兴趣的朋友。

以后如果去奇琴伊察、墨西哥城人类学博物馆、利马、库斯科、马丘比丘，再回头看这些内容，会更有感觉。

【怎么安排】
建议预留 2-3 小时。

首都博物馆开放时间通常为 9:00-20:00，19:00 停止入馆，每周二闭馆。

去之前记得在首博官方渠道确认预约、票务和当天开放情况。

【一句话】
这不是一个只看“漂亮文物”的展。

它更像是一次小小的世界文明旅行：先在北京，看懂一点墨西哥和秘鲁古文明，再把以后真正走出去的兴趣慢慢种下来。</textarea>

    </main>
    <div class="toast" id="toast">已复制</div>
    <script>
      const toast = document.getElementById("toast");
      function showToast(text) {
        toast.textContent = text;
        toast.classList.add("show");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1400);
      }
      async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }
        const temp = document.createElement("textarea");
        temp.value = text;
        temp.style.position = "fixed";
        temp.style.left = "-9999px";
        document.body.appendChild(temp);
        temp.focus();
        temp.select();
        document.execCommand("copy");
        temp.remove();
      }
      document.querySelectorAll("[data-copy-target]").forEach((button) => {
        button.addEventListener("click", async () => {
          const target = document.getElementById(button.dataset.copyTarget);
          try {
            await copyText(target.value);
            button.classList.add("copied");
            button.textContent = "已复制";
            showToast("已复制，可以粘贴到微信");
            window.setTimeout(() => {
              button.classList.remove("copied");
              button.textContent = "复制文案";
            }, 1200);
          } catch (error) {
            target.focus();
            target.select();
            showToast("请手动复制选中文案");
          }
        });
      });
    </script>
