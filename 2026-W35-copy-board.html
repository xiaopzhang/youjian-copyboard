<script>const week=[{"day": "周一", "column": "邮轮玩法", "topic": "地中海邮轮", "short": "今天给大家介绍地中海邮轮。一条船睡一周，白天靠岸逛巴塞罗那、罗马、圣托里尼这些老城，晚上回船上吃饭看演出，第二天睁眼又是一座新港口，不用天天换酒店搬行李。", "group": "【今日主题】\n地中海邮轮，一船串起老城\n\n【适合谁】\n1. 想一次看欧洲好几座名城，又不想自己查火车、拖行李换酒店的人。\n2. 喜欢“白天上岸逛、晚上回船歇”的慢节奏，不必赶夜车。\n3. 同行有人步速不一，想有个固定“移动酒店”兜底的长辈。\n\n【这条玩法是什么】\n地中海邮轮是大海邮轮，不是内河河轮。一条船常见 7 晚，从巴塞罗那、罗马（奇维塔韦基亚港）、雅典等城市登船，串起意大利、西班牙、希腊、法国南部的港口。\n关键：每天醒来已经在另一座历史名城边上，下船就能逛，省掉跨境交通和搬行李。\n\n【主要亮点】\n清晨在甲板上看海岸线慢慢靠近；白天上岸，走进罗马的许愿池、巴塞罗那的高迪建筑、圣托里尼的蓝顶白墙；傍晚回船，吃顿饭、看场演出，船趁夜开向下一座港。\n\n【特色体验】\n早上在房间阳台看爱琴海日出，海面平得像镜子；中午在圣托里尼的崖边小镇走走，蓝顶教堂对着火山岛；傍晚回船，甲板乐队响起，船已经离开港口、灯一串串退远。这种“不用自己安排交通，名城却一座座送到眼前”的轻松，是陆路很难给的。\n\n【建议怎么玩】\n西地中海一地 7–8 天轻松；想看更多可走东地中海或跨大西洋长线。选产品看三点：从哪座城市登船、停靠哪些港口、含不含岸上观光和机票。\n\n【预算参考】\n邮轮船票（不含机票）：携程参考约 4000 元/人起（常见 4000–16000 元/人）；含机票跟团游：约 16000 元/人起（常见 16000–35000 元/人）。\n具体价格看出发日期、舱房、航期和团期。\n\n【需要注意】\n地中海邮轮多为申根区港口，需办理申根签证；夏季是旺季，热门航次早订。\n船上医疗有限，有慢性病建议出发前评估、备好常用药。\n\n【一句话总结】\n地中海邮轮值得选的，是那种“不用自己安排跨境交通，欧洲名城却一座座送到眼前”的轻松。", "moments": "前阵子帮客户排欧洲线路，越看越觉得地中海这趟邮轮适合不想折腾的长辈。白天船靠岸，下去逛逛罗马、巴塞罗那、圣托里尼这些老城；傍晚回船上吃个饭、看场演出，第二天睁眼，船已经停到下一座港口了。不用查火车，也不用拖箱子换酒店，真省心。有想去的私信我，帮你看哪趟合适 🚢\n\n---"}, {"day": "周二", "column": "目的地推荐", "topic": "瑞士", "short": "今天给大家推荐瑞士。八月山里二十度上下，坐火车就能上少女峰、到卢塞恩湖边坐坐，雪山湖泊一天看个够，不用自己开车，特别适合怕麻烦又想看阿尔卑斯的朋友。", "group": "【今日目的地】\n瑞士，火车串起阿尔卑斯\n\n【适合谁】\n1. 想看阿尔卑斯雪山、湖泊和小镇，但不想每天自驾、换酒店的人。\n2. 喜欢慢节奏：一座城住下，坐火车去周边山湖 day trip。\n3. 想一次看卢塞恩、因特拉肯、采尔马特（马特洪峰），又不追高强度徒步。\n\n【为什么值得去】\n很多人以为瑞士只是“贵和干净”，其实它最厉害的是把山湖都接进了火车网——齿轨火车、缆车把普通人也能稳稳送上高处，不用爬山就能看雪峰。\n而且瑞士不大，住两三个镇、靠火车 day trip，就能把阿尔卑斯看个遍，行李不用动。\n\n【主要看什么】\n卢塞恩：湖光山色老城，廊桥和狮子碑很出片。\n因特拉肯：少女峰脚下的小镇，去雪山和湖都方便。\n采尔马特：马特洪峰下的无车小镇，火车直达。\n蒙特勒：日内瓦湖畔，西庸城堡和葡萄园。\n\n【特色体验】\n早上在卢塞恩湖边吃早餐，雪山倒映在水里；中午坐齿轨火车上少女峰，窗外一路从绿林变成雪线；傍晚回因特拉肯，小镇灯光亮起，远处山尖还留着一点白。这种“住一处、火车串着看”的节奏，对长辈特别友好。\n\n【建议玩几天】\n瑞士一地 8–10 天舒服；加法国或意大利连线 12–14 天。城市之间靠火车，建议含瑞士交通票，少自己开长途。\n\n【预算参考】\n跟团游（含机票）：携程参考约 26000 元/人起（常见 26000–39000 元/人）。\n定制小团：约 30000 元/人起（常见 30000–65000 元/人）。\n具体价格看出发城市、航班、酒店和天数。\n\n【不适合谁】\n期待“低价长线、天天逛折扣店”的人——瑞士物价偏高，节奏也偏慢，不适合赶场。\n\n【一句话总结】\n瑞士值得去的，是那种“不用开车、火车就把阿尔卑斯雪山湖泊一天串起来”的省心。", "moments": "夏天想找个凉快又好看的地方，我常推瑞士。八月山里才二十度上下，坐火车就能上少女峰、到卢塞恩湖边坐坐，雪山湖泊一天看个够，不用自己开车。住一个镇、火车串着玩，行李都不用动，对怕麻烦的长辈特别友好。想了解怎么走省心，私信我聊聊 🏔️\n\n---"}, {"day": "周三", "column": "安心出行小贴士", "topic": "欧洲旅行防扒手", "short": "今天给大家提个醒：去欧洲玩，人多的景点和地铁要防扒手。护照复印件分开存、包背身前、手机挂绳上，不是小题大做，真遇上补办很耽误事。", "group": "【今日提醒】\n欧洲游玩，先防扒手\n\n【为什么重要】\n欧洲热门景点、地铁、火车站人流密，扒手团队专挑游客下手——尤其是低头看地图、拍照、排队的人。60/70 后长辈节奏慢、防范意识弱，更容易被“声东击西”的团伙盯上。护照、钱卡一旦丢，补办很花时间、还影响行程。\n\n【具体怎么做】\n1. 护照、大额现金、银行卡分开放；护照首页和签证页复印两份，一份随身、一份留酒店。\n2. 斜挎包背在身前，拉链朝内；地铁公交上把手始终搭在包上。\n3. 手机挂绳或手绳，不用时收进包，别放外兜、别放餐厅桌面。\n4. 遇到“有人往你身上洒东西”“请你签名”“捡到钱让你分”的搭讪，不理、不停步、往人多处走。\n\n【容易忽略的细节】\n扒手常两人配合：一个挡路或搭话，另一个动手。别因为“对方看着像游客”就放松。\n在广场喂鸽子、咖啡馆晒太阳时，外套搭椅背、包放脚边，最容易丢。\n\n【适合提前准备】\n出国前把护照、签证、保单、紧急联系人拍照存手机云端；换少许零钱放随身小袋，大钱藏贴身腰包。记好当地报警电话和使馆领保电话。\n\n【一句话总结】\n欧洲防扒手不难：证件分开存、包背身前、陌生搭讪不理，出门更踏实。", "moments": "提醒一句，去欧洲玩人多的景点和地铁一定防扒手。护照复印件分开存、斜挎包背身前、手机挂绳上，不是小题大做——真丢了补办又花钱又误行程。遇到有人往你身上洒东西、拉你签名、说捡到钱要分，别理、别停步，往人多处走就对了。常出门的朋友存一下 🧳\n\n---"}, {"day": "周四", "column": "目的地推荐", "topic": "葡萄牙", "short": "今天给大家推荐葡萄牙。大西洋边上的里斯本和波尔图，老电车叮当响、蓝白瓷砖满墙，气候比地中海凉快，八月去也不燥，特别适合想看欧洲又怕热的长辈。", "group": "【今日目的地】\n葡萄牙，大西洋边的慢欧洲\n\n【适合谁】\n1. 想看欧洲，但怕地中海盛夏太热、人太挤的人。\n2. 喜欢老城慢步、电车、海边和小镇，不追高强度打卡。\n3. 想一次看里斯本、波尔图、辛特拉，再沿海走一段的人。\n\n【为什么值得去】\n很多人以为葡萄牙只是“西班牙旁边的小国”，其实它面向大西洋，气候更温润：八月大多二十多度，比西班牙内陆凉快得多。\n而且它的味道很特别——里斯本的电车叮当响着爬坡，满墙蓝白瓷砖（azulejo）、蛋挞刚出炉的香气，是一种松弛的、生活气的欧洲。\n\n【主要看什么】\n里斯本：老电车、阿尔法玛老城、贝伦塔与蛋挞老店。\n波尔图：杜罗河畔、蓝瓷教堂、酒窖桥景。\n辛特拉：山间王宫与庄园，浓雾里的童话感。\n阿尔加维：大西洋崖岸与暖色沙滩（想要海边加一天就好）。\n\n【特色体验】\n早上在里斯本坐 28 路老电车晃上山坡，老城红顶一片片铺到河边；中午在贝伦啃一个刚出炉的蛋挞；下午到波尔图，沿杜罗河走，对岸酒窖的灯一串串亮起。这种“电车、瓷砖、海边，节奏不慌”的欧洲，长辈走起来不累。\n\n【建议玩几天】\n葡萄牙一地 8–10 天舒服；加西班牙走“西葡连线”12–14 天更完整。城市间火车/大巴方便，建议含接送，少自己开长途。\n\n【预算参考】\n跟团游（含机票）：携程参考约 22000 元/人起（常见 22000–34000 元/人）。\n定制小团：约 28000 元/人起（常见 28000–55000 元/人）。\n具体价格看出发城市、航班、酒店和天数。\n\n【不适合谁】\n期待“阳光沙滩度假村、天天躺海滩”的人——葡萄牙的看点主要在老城、电车与文化，海岸是点缀不是主体。\n\n【一句话总结】\n葡萄牙值得去的，是那种“大西洋边、凉快不燥，电车瓷砖里慢慢过”的松弛欧洲。", "moments": "想看欧洲又怕夏天太热，我常推葡萄牙。它面大西洋，八月才二十多度，比地中海凉快。里斯本老电车叮当爬坡，满墙蓝白瓷砖，刚出炉的蛋挞香；波尔图沿杜罗河走，对岸酒窖灯一串串亮。电车、瓷砖、海边，节奏不慌，长辈走起来不累。想了解西葡连线怎么走，私信我聊聊 🚋\n\n---"}, {"day": "周五", "column": "全球景点与体验", "topic": "圣米歇尔山", "short": "今天给大家介绍圣米歇尔山。这座建在礁石上的修道院，最神的是脚下海湾潮差十几米，退潮是滩涂、涨潮又变孤岛，像从海里长出来的一座山，很适合放进法国一程慢慢看。", "group": "【今日体验】\n圣米歇尔山，海中长出的城\n\n【为什么特别】\n很多人以为圣米歇尔山只是“漂亮的中世纪修道院”，其实它最神的是位置：建在礁石上，脚下是欧洲潮差最大的海湾之一，潮差可达十几米。\n退潮时是一片广阔滩涂，涨潮时海水把山重新围成孤岛——修道院就像“从海里长出来”。这种天地之间的孤绝感，是它几百年来被人朝圣的原因。\n\n【特色体验】\n清晨海湾还是滩涂，山孤零零立在中央；接近中午潮水漫上来，山脚渐渐被水抱住；傍晚逆光里，修道院尖顶染成金红。沿朝圣古道走上山顶，石墙、回廊、祭坛一层层往上，海风从窗口灌进来。\n\n【适合谁】\n1. 去法国、想看一处“世界遗产级”地标，而不只是逛巴黎的人。\n2. 喜欢海岸、古建筑与一点传奇色彩，节奏不赶的人。\n3. 长辈同行也合适——有接驳车和坡道，不必全程徒步登顶。\n\n【最佳时间】\n春到秋都适宜，夏季白天长、天气稳，是旺季。具体看当天潮汐表，涨落之间景色差别很大。\n\n【怎么到达或怎么安排】\n如果您是自由行，从巴黎出发可以参加圣米歇尔山一日游，含往返接送、中文讲解和修道院门票，不用自己开长途、不用抢票。这个体验适合放进“法国”整线，或作为巴黎周边的一日游安排。\n\n【预算参考】\n巴黎出发圣米歇尔山一日游（含接送＋门票＋讲解）：携程参考约 900 元/人起（常见 900–1800 元/人，小团或含餐更高）。\n\n【需要注意】\n海湾潮差大、滩涂看似平坦却有流沙与快速涨潮，务必走指定路线、跟紧向导，不要独自下滩。\n山顶修道院有台阶和坡道，长辈量力慢行。\n\n【适合搭配哪条线路】\n适合放进“法国”或“法瑞意”跟团/定制游；若只在巴黎周边，单独一日游就能看个够。\n\n【一句话总结】\n圣米歇尔山值得看的，是那种“潮起成岛、潮落成滩，山像从海里长出来”的孤绝。", "moments": "前阵子排法国线路，越看越觉得圣米歇尔山值得专程去。它建在礁石上，脚下海湾潮差十几米——退潮是广阔滩涂，涨潮又把山围成孤岛，修道院像从海里长出来。沿古道走上山顶，海风从窗口灌进来，那种孤绝感很特别。想轻松看一场，私信我聊聊 ⛪"}];

};const nav=document.getElementById("dayNav"),cards=document.getElementById("cards"),title=document.getElementById("pageTitle"),subtitle=document.getElementById("pageSubtitle"),imageNote=document.getElementById("imageNote"),toast=document.getElementById("toast"),copyAll=document.getElementById("copyAll");let current=0;function copyText(value,button){navigator.clipboard.writeText(value).then(()=>{const old=button.textContent;button.textContent="已复制";button.classList.add("copied");toast.classList.add("show");setTimeout(()=>{button.textContent=old;button.classList.remove("copied");toast.classList.remove("show")},1300)})}function card(label,value,brief=false){const article=document.createElement("article");article.className=brief?"card brief":"card";const header=document.createElement("header"),heading=document.createElement("h3"),button=document.createElement("button"),area=document.createElement("textarea");heading.textContent=label;button.className="copy-btn";button.textContent="复制文案";button.addEventListener("click",()=>copyText(value,button));area.value=value;area.setAttribute("aria-label",label);header.append(heading,button);article.append(header,area);return article}function render(index){current=index;const item=week[index];[...nav.children].forEach((button,i)=>button.classList.toggle("active",i===index));title.textContent=`${item.day}｜${item.column}`;subtitle.textContent=item.topic;imageNote.textContent=notes[item.day];cards.replaceChildren(card("简短群发版",item.short,true),card("群发版",item.group),card("朋友圈版",item.moments))}week.forEach((item,index)=>{const button=document.createElement("button");button.innerHTML=`<span class="day">${item.day} · ${item.column}</span><span class="topic">${item.topic}</span>`;button.addEventListener("click",()=>render(index));nav.append(button)});copyAll.addEventListener("click",()=>{const item=week[current];copyText(`【简短群发版】
${item.short}

【群发版】
${item.group}

【朋友圈版】
${item.moments}`,copyAll)});render(0);</script></body></html>
