<script>const week=[{"day":"周一","column":"邮轮玩法","topic":"地中海邮轮","short":"今天给大家介绍地中海邮轮。白天下船逛欧洲老城，晚上回船上吃饭看海，第二天醒来已经在下一座港口，不用自己订车搬行李、天天换酒店。","group":"【今日主题】\n地中海邮轮，一天一城不搬行李\n\n【适合谁】\n1. 想一次看几座欧洲城市，但不想天天收拾行李、拖箱子赶路。\n2. 能接受长途飞行，愿意把体力留给岸上真正想看的风景。\n3. 喜欢晚上在船上休息、白天慢慢下船逛的人。\n\n【这条玩法是什么】\n常见航线从罗马、巴塞罗那、马赛等港口出发，邮轮约 7–8 晚，停靠意大利、法国、西班牙沿岸城市，有时还去马耳他。\n白天上岸看城，傍晚回船吃饭看演出，第二天醒来已经在下一座港口——不用自己订火车、搬行李、换酒店。\n\n【主要亮点】\n如果是罗马出发的航线，常见会停那不勒斯（看庞贝古城）、佛罗伦萨（文艺复兴）、马赛或尼斯（南法海岸）、巴塞罗那（高迪建筑）。\n一座城一个上午或半天，节奏比自己开车串联轻松太多。\n\n【特色体验】\n清晨在甲板吃早餐，眼前是还没有醒来的港口城市。下船后慢慢走进老城，下午回到船上冲个澡、看场演出，晚上倚着栏杆看海。这种“白天逛欧洲、晚上回海上”的节奏，是陆地自由行很难复制的。\n\n【建议怎么玩】\n邮轮本身约 7–8 晚，加上往返航班和前后城市，完整行程安排 10–14 天比较合适。\n选产品时先看停靠哪些港、岸上观光含什么，再看船公司与舱房，不要只比价格。\n\n【预算参考】\n单船票（自己办机票和签证）：携程参考约 4000 元/人起（常见 4000–16000 元/人）。\n含国际机票、申根签证、岸上观光的跟团产品：约 16000 元/人起（常见 16000–35000 元/人）。\n具体价格看出发日期、登船港、舱房和岸上安排。\n\n【需要注意】\n地中海邮轮多在南欧登船，8月当地正热，岸上观光尽量选上午、避开最晒时段。\n登船港通常在意大利、西班牙、法国等申根国家，需要提前办理申根签证。\n\n【一句话总结】\n地中海邮轮值得选的，是那条把您想看的几座欧洲城市，轻轻串进一趟海上假期的航线。","moments":"前几天帮客户排欧洲线路，越看越觉得地中海这趟邮轮挺适合不想天天折腾的人。白天船靠岸，下去逛逛庞贝、佛罗伦萨这些老城；傍晚回船上吃个饭、看场演出，第二天睁眼，船已经停到下一座港口了。不用自己查火车，也不用拖箱子换酒店，真省心。有想去的私信我，帮你看哪趟合适 🚢"},{"day":"周二","column":"目的地推荐","topic":"瑞士阿尔卑斯","short":"今天给大家推荐瑞士阿尔卑斯。夏天山区只有二十多度，缆车、齿轮火车和游船替您爬山看湖，不用自己开车赶路，怕热又想看风景的朋友会很合适。","group":"【今日目的地】\n瑞士山城，夏天不用躲空调\n\n【适合谁】\n1. 怕热、想找个凉快地方过夏天，又不想去太远太折腾。\n2. 喜欢山、湖、小镇，愿意上午看点、午后休息，不追打卡数量。\n3. 希望交通省心：缆车、齿轨火车、游船代步，不用自己开车爬山。\n\n【为什么值得去】\n很多人以为瑞士只是“贵”，其实它夏天最舒服——阿尔卑斯山区 6–9 月气温多在 20 出头，雪山融水让湖泊蓝得发亮，山间野花正开。\n而且瑞士把“上山”这件事做得特别轻松：齿轮火车钻进山腹，缆车直接送到观景台，游船在湖上慢慢开。看风景这件事，对年纪大的人也很友好。\n\n【主要看什么】\n少女峰地区：乘齿轨火车上“欧洲之巅”，隧道里还有观景窗看冰川。\n卢塞恩：卡佩尔廊桥、垂死狮子像，坐船游湖看天鹅。\n因特拉肯：夹在图恩湖和布里恩茨湖之间，被称为“瑞士最蓝的眼睛”。\n采尔马特：无车小镇，看马特洪峰倒影。\n\n【特色体验】\n早上在卢塞恩湖边吃早餐，湖水蓝得像打翻了颜料。乘船到对面小镇，再换缆车慢慢上山，山顶一阵凉风，远处雪顶被太阳染成玫瑰金。不用赶，坐下来看一会儿，就是旅行。\n\n【建议玩几天】\n瑞士一地或瑞士+周边，安排 8–10 天比较舒服。山区景点分散，建议选含交通的通票或当地参团，少折腾。\n\n【预算参考】\n普通跟团（含国际机票）：携程参考约 26000 元/人起（常见 26000–39000 元/人）。\n轻奢小团 / 定制私家团：约 41000 元/人起（常见 41000–60000 元/人）。\n具体价格看出发日期、航班、酒店和人数。\n\n【不适合谁】\n预算非常紧、或对“看风景为主、购物为辅”不感兴趣的人。瑞士物价偏高，若期待低价扫货，这里不合适。\n\n【一句话总结】\n瑞士夏天值得去的，是那种“山上凉风、湖边慢坐、缆车替你爬山”的舒服节奏。","moments":"前几天帮客户排夏天线路，越看越觉得瑞士挺适合怕热的人。阿尔卑斯山区夏天才二十度出头，缆车、齿轨火车、游船直接替你把山和湖看遍，不用自己开车爬山。早上在湖边吃早餐，远处雪顶被太阳染成玫瑰金，坐下来看一会儿就是旅行。想了解哪段顺路的，私信我聊聊 🏔️"},{"day":"周三","column":"安心出行小贴士","topic":"欧洲夏季防扒手","short":"今天给大家提个醒：欧洲暑期人多的景点，最容易丢的是护照和签证。背包前背、证件分开存、拍照备份，这几件小事能让整趟行程安心很多。","group":"【今日提醒】\n人多的欧洲景点，先护好证件\n\n【为什么重要】\n暑期欧洲人最多，扒手也最活跃。机场、地铁、热门景点（巴黎铁塔、罗马斗兽场、巴塞罗那兰布拉大道）是高频地点。\n对咱们这个年纪出门的朋友，最怕的不是丢点钱，而是护照、签证一起丢——补证件会打乱整段行程。\n\n【具体怎么做】\n1. 背包斜挎在身前，拉链那面贴着自己，手搭在包上。\n2. 护照、大额现金、备用卡分开放；酒店保险箱存一份，贴身腰包放一份。\n3. 护照、签证页拍照存手机和邮箱，万一丢了补办快很多。\n4. 现金少带，日常花费用信用卡，身上留两三百欧应急足够。\n5. 有人突然靠近搭讪、塞东西、要签名，先摸一下自己的包。\n\n【容易忽略的细节】\n地铁车门关的瞬间，有人会从手里抢手机——在地铁里别把手机举在门口。\n餐厅露天座位，手机放桌上容易被顺手拿走。\n同伴之间互相提醒，一个看包一个拍照，比各顾各的稳妥。\n\n【适合提前准备】\n出发前买好防盗腰包或带暗袋的衣物；把使馆电话、信用卡挂失热线存进手机。\n出门只带当天要用的钱和卡，其余锁酒店。\n\n【一句话总结】\n欧洲玩得放心，第一步不是看多少景点，而是证件钱财先护牢。","moments":"提醒一句，暑期去欧洲一定看牢证件。前阵子听朋友说，在巴黎地铁里背包拉链被人拉开，好在现金不多，可护照和机票都在里头——补证件一耽误就是好几天行程。后来我就养成习惯：背包斜挎身前、护照和备用卡分开放、护照页拍张照存手机。几件小事，整趟能安心不少。要一份防扒手清单的私信我 🛂"},{"day":"周四","column":"目的地推荐","topic":"葡萄牙·里斯本与波尔图","short":"今天给大家推荐葡萄牙的里斯本和波尔图。坐28路电车晃过彩色老城，到波尔图沿杜罗河尝一口波特酒，傍晚看夕阳染金河面——花钱比法瑞轻松，节奏也慢得刚好。","group":"【今日目的地】\n葡萄牙双城，慢得刚刚好\n\n【适合谁】\n1. 喜欢老城、电车、海边和美食，但不想天天赶景点。\n2. 想找个性价比高些的欧洲目的地，花钱不像法瑞那么紧。\n3. 愿意上午逛、中午歇、傍晚看日落的人。\n\n【为什么值得去】\n很多人以为葡萄牙只是“欧洲的边角”，其实它把老日子过得很有味道。里斯本的电车叮叮穿过彩色老城，波尔图的杜罗河上酒香醉人。\n更特别的是罗卡角——欧洲大陆的最西端，碑上写着“陆止于此，海始于斯”。站在那里，脚下是悬崖，面前是大西洋，会觉得世界一下子开阔了。\n\n【主要看什么】\n里斯本：阿尔法玛老城坐28路电车、圣若热城堡看红屋顶、贝伦塔和热罗尼莫斯修道院、蛋挞发源地。\n波尔图：杜罗河、路易一世大桥、莱罗书店（哈利波特灵感地）、河边酒庄尝波特酒。\n周边可去辛特拉（童话佩纳宫）、罗卡角。\n\n【特色体验】\n早上在里斯本老城吃个刚出炉的蛋挞，坐28路电车晃过七座小山，橘红屋顶在阳光下发亮。下午到波尔图，沿着杜罗河走，进一家酒庄尝一口甜润的波特酒，傍晚坐在河边看夕阳把河水染成金色。这种慢，是旅行里最舒服的部分。\n\n【建议玩几天】\n葡萄牙一地或西葡连线，安排 10–13 天。里斯本到波尔图火车约3小时，双城节奏很轻松。\n\n【预算参考】\n西葡连线跟团（含国际机票）：携程参考约 19800 元/人起（常见 20000–33000 元/人）。\n葡萄牙深度10日（广州出发）：约 20000 元/人起。\n葡萄牙+西班牙定制私家团：约 30000 元/人起（常见 30000–65000 元/人）。\n具体看出发城市、天数、航班和酒店。\n\n【不适合谁】\n8月里斯本、波尔图偏热（白天气温常到三十度上下），怕热又不愿避开正午的人要斟酌；纯葡萄牙一地产品较少，多为西葡连线。\n\n【一句话总结】\n葡萄牙值得去的，是那种电车、海边、蛋挞和波特酒凑在一起的、慢得刚刚好的日子。","moments":"前几天排欧洲线，被葡萄牙惊艳到了。里斯本坐28路电车晃过彩色老城，波尔图沿杜罗河尝一口波特酒，最戳我的是罗卡角——欧洲大陆最西端，碑上写着“陆止于此，海始于斯”。慢得刚好，花钱也比法瑞轻松。想走这条线的私信我 🇵🇹"},{"day":"周五","column":"全球景点与体验","topic":"法国·圣米歇尔山","short":"今天给大家介绍圣米歇尔山。它建在潮汐岛上，涨潮时整座山像浮在海上的孤岛，退潮又连回陆地，欧洲最高潮差就在眼前——从巴黎一日往返就能看。","group":"【今日体验】\n圣米歇尔山，涨潮变海中孤岛\n\n【为什么特别】\n它不只是一座山，而是一座建在潮汐岛上的千年修道院。涨潮时海水包围，整座山像浮在海上的孤岛；退潮时滩涂出现，它又连回陆地。\n雨果说过：“圣米歇尔山对法国，如同大金字塔对埃及一样重要。”欧洲最高潮差就在这里，最大能到15米。\n\n【特色体验】\n远远看，一座尖顶教堂立在岩石上，周围是一望无际的滩涂和海。走近走过长堤，两边是石屋改成的餐厅小店，抬头就是修道院尖顶。登到回廊，拱廊、蓝海、尖顶同框，风从海上来。若赶上大潮，整座山被海水环抱，像漂浮的圣殿。\n\n【适合谁】\n想看“此生必去”的地标、能接受半天步行和台阶的人。\n从巴黎出发一日往返很方便，也可以放在法国行程里。\n\n【最佳时间】\n看潮汐表：大潮时山被海水包围最震撼；夏天傍晚光线柔和，适合拍照。\n开放时间随季节，夏季多到19点左右，出发前查官网。\n\n【怎么到达或怎么安排】\n如果您是自由行，也可以从巴黎参加当地一日游或包车，含往返交通和修道院门票，不一定要自己研究火车转大巴。\n我们也能协助预订这类当地一日游、门票和中文讲解。\n\n【预算参考】\n当地一日游（含交通＋门票）：约 980 元/人起（常见 980–1650 元/人）\n包车定制：约 1350 元/人起（常见 1350–2400 元/人）\n单门票：约 100 元/人起（常见 100–130 元/人）\n\n【需要注意】\n上山石板路多、有坡度，海风大，穿防滑鞋、带件防风外套。\n腿脚极不便的朋友要斟酌——台阶不少，建议量力而行。\n退潮的滩涂不要自己走进去，流沙和快速涨潮有危险，跟持证向导才安全。\n\n【适合搭配哪条线路】\n适合放在法国游或西葡+法国行程里，作为巴黎周边的一日体验。\n\n【一句话总结】\n圣米歇尔山值得看的，是那一刻潮汐把一座千年修道院，变成了海上的孤岛。","moments":"法国有座山挺神奇——圣米歇尔山建在潮汐岛上，涨潮时整座山像浮在海上的孤岛，退潮又连回陆地，欧洲最高潮差就在那儿。清晨薄雾里，修道院尖顶从海平面慢慢浮出来，像童话里的场景。从巴黎出发当天就能往返看。想顺路安排的朋友私信我 🏰"}];
